n\"T-21\",\n\"Любой\",\n\"Прежний или M-06\",\n\"Автоматически\",\n\"Восстановление сетевого питания\",\n\"Если питание приводов не прерывалось, режим сохраняется, причина П1 «нет сетевого питания» снимается, прием возобновляется (SR-183). Если РТК был полностью обесточен, он включается в прежнем режиме, а вместо M-02 и M-03 — в M-06\"\n],\n[\n\"T-22\",\n\"Выключен\",\n\"M-01\",\n\"Штатное включение\",\n\"—\",\n\"—\"\n],\n[\n\"T-23\",\n\"M-01\",\n\"Выключен\",\n\"Сервисный инженер или сотрудник, на месте\",\n\"Ячейки пусты\",\n\"—\"\n],\n[\n\"T-24\",\n\"M-01, M-04\",\n\"M-05.3\",\n\"Инженер-разработчик или сервисный инженер, сервисная панель\",\n\"Аутентификация\",\n\"Как T-01\"\n],\n[\n\"T-25\",\n\"M-03\",\n\"M-05.3\",\n\"Инженер-разработчик или сервисный инженер, сервисная панель\",\n\"Как T-08\",\n\"Как T-06\"\n],\n[\n\"T-26\",\n\"M-04\",\n\"M-05.2\",\n\"Автоматически\",\n\"Сотрудник подтвердил завершение работ, дверь закрыта, отметка «Критический отказ» установлена\",\n\"Уведомление диспетчеру\"\n]\n]\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Пропадание сетевого питания\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Сеть пропала в M-03: в П1 появляется причина «нет сетевого питания». Нагрев отключается: нагревательные элементы не питаются от ИБП (решение 4). Текущая операция завершается, изделие проходит обычный контроль и идет в ячейку выдачи или брака. Манипуляторы паркуются, П2 = «Ожидание», приводы остаются под питанием ИБП.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Сеть вернулась до порога заряда ИБП: T-21, причина снимается, нагрев включается, позиции с нагревом возвращаются в П3 после прогрева. Человек не нужен (SR-183).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Заряд ИБП ниже порога: T-10, питание приводов снимается в парковочном положении, РТК в M-06. Это плановая остановка, а не функция безопасности.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Сеть вернулась после этого: РТК остается в M-06, пуск на месте по T-19.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"В M-02 действует та же логика с переходом T-05. В остальных режимах движения нет, режим сохраняется.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Автономность ИБП — не менее 5 мин (В-11).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Категории остановки\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Категории по ГОСТ Р МЭК 60204-1, 9.2.2: 0 — немедленное снятие питания приводов, 1 — управляемая остановка, затем снятие питания, 2 — управляемая остановка с сохранением питания.\"\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"Функция\",\n\"Источник\",\n\"Категория\",\n\"Нагрев\"\n],\n[\n\"Аварийная остановка\",\n\"Кнопка SS-13.03\",\n\"0\",\n\"Выключается\"\n],\n[\n\"Защитная остановка по двери\",\n\"Устройство блокировки двери SS-15.03\",\n\"0\",\n\"Сохраняется\"\n],\n[\n\"Остановка по пожарному сигналу\",\n\"Пожарная сигнализация магазина (SR-299)\",\n\"0\",\n\"Выключается\"\n],\n[\n\"Остановка по столкновению\",\n\"Контроллер AUBO\",\n\"0 (В-13)\",\n\"Сохраняется\"\n],\n[\n\"Отказ контроллера безопасности\",\n\"Самодиагностика SS-13.05\",\n\"0\",\n\"Выключается\"\n]\n]\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"При категории 0 контроллеры манипуляторов и оси остаются включенными и сохраняют положение (В-18). Звенья AUBO и каретки оси удерживаются тормозами (В-16), захваты удерживают изделие без питания (В-17).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"При категории 0 манипулятор может сойти с траектории. Поэтому автоматический возврат в M-02 выполняется только при отклонении не более Δ (условие 6 У-1).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Плановые остановки при переходе в M-04 и M-05 и пр : \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Расход на брак передается для ручного списания (CS-SN-020).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Если свободной ячейки нет: в M-03 изделие остается в захвате, П2 = «Ожидание вмешательства», в M-02 — приостановка с подсказкой на сервисной панели.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Оценка по замечанию 6. Пик 25 заказов в час, модель массового обслуживания с неограниченным числом мест (M/G/∞). Допущения консервативные: каждый покупатель ждет все 3 мин, 5% заказов истекают, 3% напитков уходят в брак, сотрудник освобождает ячейку через 15 мин после события.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Средняя занятость — 1,75 ячейки из 8. Если заказ в среднем занимает 1,3 ячейки — 2,2.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Вероятность занятости всех 8 ячеек — 0,05–0,2% пикового времени.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Остановка из-за брака без свободной ячейки дает менее 0,05% внепланового простоя в пик. Бюджет — 5%.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Постоянный резерв одной ячейки снижает емкость выдачи на 12,5%.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Вывод: резерв не нужен. Риск закрыт звуковым сообщением и эскалацией через 10 мин. На этапе 2 проверить допущения по фактической доле истекших заказов и брака.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Звуковое оповещение и эскалация\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"РТК воспроизводит в торговом зале сообщение «Внимание, требуется помощь в кафетерии» при событиях: П2 = «Ожидание вмешательства», переход в M-06, пролив или загрязнение, истечение срока выдачи заказа, брак в ячейке.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Если событие не устранено за 10 мин после сообщения, уведомление уходит диспетчеру.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Канал оповещения и повтор сообщения — открытый вопрос QQ-120.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Требования: SR-352, SR-352.1, SR-352.2 (предложены в книгу). SR-189.1 поглощается SR-352.2.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Незавершенные заказы (ответ на Q-42)\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Изделие, оставленное остановкой в захвате или на позиции оборудования, при запуске (M-02) переносится в ячейку брака. Позиция возвращается в «В очереди» без увеличения счетчика попыток.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"M-04.2 и M-06: не начатые позиции ждут возврата в M-03. Хаб получает статус «Недоступен» с причиной. РТК позиции по таймауту не отменяет: решение о возврате денег принимает Контур (CS-SR-009, CS-SR-029 Контура).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Ручное завершение позиции: в M-04.2 сотрудник магазина готовит позицию на оборудовании РТК с его панелей и передает покупателю. Ручную выдачу он подтверждает на сервисной панели. РТК переводит позицию в «Выдана» с признаком «вручную», списывает расход по технологической карте (SR-325.1.2) и передает хабу событие ручной выдачи с перечнем позиций. Исполнитель позиции не меняется, поэтому это не перемаршрутизация. Ответ закрывает QQ-119 книги.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"M-05.2: РТК отменяет все позиции, которые еще не стоят в ячейках, с кодом причины «критический отказ». Позиции в ячейках покупатель забирает как обычно. Возврат денег за отмененные позиции выполняет Контур.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Нужны пары IFR с хабом: событие ручной выдачи причину П1)\",\n\"Любой режим\",\n\"Установка — нет, снятие — да, открывает прием\",\n\"CS-SR-121 Контура\"\n]\n]\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Опасная команда выполняется только в M-03 при признаке «Зона подтверждена пустой» и неактивном локальном управлении (5.6.5 b, e, i). В M-03 зона всегда подтверждена пустой, потому что войти в M-03 можно только через У-1.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Пока выполняется удаленная команда, сервисная панель это показывает (5.6.5 g).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Контроллер и ПО безопасности (SS-13.05, SS-07.10) удаленно не перезапускаются.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Машина состояний заказа\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Состояние заказа сводное, детали — в состояниях позиций: «В очереди», «Готовится», «Готова» (в ячейке), «Выдана» (из ячейки или вручную), «Утилизирована», «Отменена» с кодом причины. Брак — событие: позиция возвращается в «В очереди», счетчик попыток увеличивается.\"\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"Состояние\",\n\"Определение\"\n],\n[\n\"Принят\",\n\"Заказ получен от хаба (SR-292), оплата не подтверждена\"\n],\n[\n\"В очереди\",\n\"Оплата подтверждена (SR-294), приготовление не начато\"\n],\n[\n\"Готовится\",\n\"Приготовление начато, ни одна позиция не стоит в ячейке\"\n],\n[\n\"Частично готов\",\n\"Часть позиций стоит в ячейках и доступна покупателю, остальные будут готовы позже чем через 20 с\"\n],\n[\n\"Готов к выдаче\",\n\"Все неотмененные позиции стоят в ячейках или выданы вручную, хотя бы одна стоит в ячейке\"\n],\n[\n\"Выдан\",\n\"Все неотмененные позиции выданы из ячеек (SR-108.1.4) или вручную. Конечное\"\n],\n[\n\"Истек срок выдачи\",\n\"Время ожидания истекло хотя бы для одной ячейки заказа, ячейка занята\"\n],\n[\n\"Утилизирован\",\n\"Все ячейки заказа освобождены, хотя бы одна — сотрудником (SR-110.5.2). Конечное\"\n],\n[\n\"Отменен\",\n\"Все позиции отменены, указаны код причины и инициатор. Конечное\"\n]\n]\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"№\",\n\"Из\",\n\"В\",\n\"Событие\"\n],\n[\n\"З-01\",\n\"—\",\n\"Принят\",\n\"Данные заказа от хаба\"\n],\n[\n\"З-02\",\n\"Принят\",\n\"В очереди\",\n\"Подтверждение оплаты\"\n],\n[\n\"З-03\",\n\"Принят, В очереди\",\n\"Отменен\",\n\"Отмена оплаты или таймаут (SR-293), инициатор — хаб\"\n],\n[\n\"З-04\",\n\"В очереди\",\n\"Готовится\",\n\"Начата первая позиция\"\n],\n[\n\"З-05\",\n\"Готовится\",\n\"Частично готов\",\n\"Первая позиция поставлена в ячейку, остальные не будут готовы в течение 20 с\"\n],\n[\n\"З-06\",\n\"Готовится, Частично готов\",\n\"Готов к выдаче\",\n\"Последняя неотмененная позиция поставлена в ячейку или выдана вручную, хотя бы одна позиция стоит в ячейке\"\n],\n[\n\"З-07\",\n\"Готов к выдаче\",\n\"Выдан\",\n\"Покупатель освободил последнюю занятую ячейку заказа\"\n],\n[\n\"З-08\",\n\"Частично готов, Готов к выдаче\",\n\"Истек срок выдачи\",\n\"Истекло время ожидания ячейки заказа. Остальные позиции доготавливаются и ставятся в ячейки\"\n],\n[\n\"З-09\",\n\"Истек срок выдачи\",\n\"Утилизирован\",\n\"Освобождена последняя занятая ячейка заказа\"\n],\n[\n\"З-10\",\n\"В очереди, Готовится\",\n\"Отменен\",\n\"Отменены все позиции заказа: исчерпаны попытки или критический отказ. Инициатор — РТК, код причины передается хабу\"\n],\n[\n\"З-11\",\n\"Готовится, Частично готов\",\n\"Выдан\",\n\"Сотрудник подтвердил ручную выдачу всех оставшихся позиций, в ячейках нет позиций заказа\"\n]\n]\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Если отменены не все позиции, состояние заказа определяют оставшиеся: З-06, З-07 или З-11 с учетом отмененных позиций.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Время ожидания выдачи — 3 мин, отсчет для каждой ячейки от ее разблокировки со стороны покупателя (Q-57).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Ячейка с истекшим сроком заперта для покупателя (SR-109.1), освобождает ее сотрудник.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Сценарии, измененные в v3.2\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Аварийный останов\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"M-03: нажата кнопка аварийного останова. T-10: остановка категории 0, тормоза удерживают звенья и каретки, захват удерживает изделие, нагрев выключается, звуковое сообщение.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"M-06: функция безопасности остается сработавшей до сброса на месте.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Нужна уборка — T-18 в M-04.2, затем T-12. Не нужна — T-19.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"При проверке У-1 отклонение от траектории больше Δ: пуск невозможен, диспетчер вызывает инженера, инженер переходит в M-05.2 по T-20, возвращает манипулятор вручную и запускает РТК по T-16.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"M-02: возврат через ближайшую ключевую точку со скоростью не более 250 мм/с, изделие из захвата или с позиции оборудования — в ячейку брака, самопроверка, T-04.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Пропадание питания — по разделу «Пропадание сетевого питания».\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Столкновение\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"M-03: контроллер AUBO обнаружил столкновение. T-10: остановка категории 0, M-06, звуковое сообщение. Счетчики столкновений: по операции и за смену.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Первое столкновение: сотрудник осматривает зону и выполняет пуск на месте (T-19) или убирает (T-18, затем T-12).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Второе в той же операции или третье за смену: отметка «Критический отказ», выход из M-06 только по T-20.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Ручное завершение позиции\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"РТК в M-06 или в M-03 с П2 = «Ожидание вмешательства», заказ покупателя не готов.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Сотрудник запрашивает вход (T-18 или T-07), РТК в M-04.2 и не управляет оборудованием приготовления.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Сотрудник готовит позицию с панелей оборудования, передает покупателю, подтверждает ручную выдачу на сервисной панели.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"РТК переводит позицию в «Выдана», списывает расход, передает хабу событие ручной выдачи. Заказ переходит по З-06 или З-11.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Сотрудник устраняет причину остановки, пуск по T-12.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Параметры и определения\"\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"Параметр\",\n\"Значение\",\n\"Источник\"\n],\n[\n\"Смена\",\n\"Интервал между двумя последовательными ежедневными обслуживаниями M-04.1\",\n\"Замечание 7\"\n],\n[\n\"Плановое время ежедневного обслуживания\",\n\"Начало и окончание графика, для круглосуточной точки задает магазин\",\n\"Замечание 7\"\n],\n[\n\"Время ожидания выдачи\",\n\"3 мин, по каждой ячейке от разблокировки\",\n\"Решение 7, Q-57\"\n],\n[\n\"Синхронизация выдачи позиций заказа\",\n\"20 с\",\n\"Решение 7\"\n],\n[\n\"N — эскалация диспетчеру\",\n\"10 мин\",\n\"Q-58\"\n],\n[\n\"Окно T-13\",\n\"60 мин от планового времени ежедневного обслуживания\",\n\"Q-58\"\n],\n[\n\"Уведомление о невыполненном обслуживании\",\n\"Через 30 мин после планового времени в конце смены\",\n\"v3, T-11\"\n],\n[\n\"Окончание приема\",\n\"За 8 мин до окончания графика\",\n\"Q-38\"\n],\n[\n\"Лимиты повтора\",\n\"3 попытки на позицию, 3 неудачи подряд на сборку\",\n\"В-8\"\n],\n[\n\"Лимиты столкновений\",\n\"2 в одной операции или 3 в любых операциях за смену\",\n\"Q-58\"\n],\n[\n\"Скорость возврата в M-02\",\n\"Не более 250 мм/с\",\n\"В-12\"\n],\n[\n\"Автономность ИБП\",\n\"Не менее 5 мин\",\n\"В-11\"\n],\n[\n\"Δ — допустимое отклонение от траектории\",\n\"Не определено\",\n\"В-19\"\n]\n]\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Вопросы к специалистам\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"В-16 и В-17 закрыты: у каждой каретки есть тормоз, захваты удерживают изделие без питания.\"\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"№\",\n\"Вопрос\"\n],\n[\n\"В-18\",\n\"Остаются ли контроллеры AUBO i10 и контроллер оси включенными при остановке категории 0 по сигналу внешнего контроллера безопасности? Сохраняется ли положение звеньев и кареток после перезапуска контроллера, или нужен поиск исходной точки с движением?\"\n],\n[\n\"В-19\",\n\"Какое отклонение Δ от траектории допустимо для автоматического возврата, то есть каков радиус свободной от препятствий зоны вокруг траекторий? Каков тормозной путь звеньев и кареток при категории 0 на рабочих скоростях? Ответ нужен и для переоценки H-01.05, H-01.06, H-05.01\"\n]\n]\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Решения v3.2 для раздела «Принятые решения»\"\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"№\",\n\"Решение\",\n\"Обоснование\",\n\"Норма\"\n],\n[\n\"12\",\n\"Все функции безопасности выполняют остановку категории 0\",\n\"AUBO по внешнему сигналу поддерживает только категорию 0 (В-13), у кареток есть тормоза (В-16), захваты удерживают изделие (В-17)\",\n\"ГОСТ Р МЭК 60204-1, 9.2.2, 9.2.5.4.2. ГОСТ Р 60.1.2.2, 5.3.8\"\n],\n[\n\"13\",\n\"Автоматический возврат после остановки — только при отклонении от траектории не более Δ. Иначе манипулятор возвращает инженер вручную\",\n\"Возврат из неизвестного положения может привести к столкновению с оборудованием\",\n\"Реестр рисков: H-01.06, H-05.01\"\n],\n[\n\"14\",\n\"При пропадании сети РТК завершает операцию, паркует манипуляторы и ждет на питании от ИБП. До порога заряда — автоматическое возобновление, после — защитная остановка\",\n\"Уточнение решения 4\",\n\"SR-183\"\n],\n[\n\"15\",\n\"Ячейка под брак заранее не резервируется\",\n\"Вклад во внеплановый простой менее 0,05%, резерв снижает емкость выдачи на 12,5%\",\n\"—\"\n],\n[\n\"16\",\n\"Смена — интервал между двумя ежедневными обслуживаниями\",\n\"Нужна для круглосуточных точек и счетчиков столкновений\",\n\"—\"\n],\n[\n\"17\",\n\"Второе столкновение в той же операции или третье за смену — критический отказ\",\n\"Повтор указывает на систематическую причину: смещение оборудования, сбой калибровки\",\n\"—\"\n],\n[\n\"18\",\n\"Звуковое сообщение в торговом зале и эскалация диспетчеру через 10 мин\",\n\"В целевом решении персонала в зоне кафетерия нет\",\n\"—\"\n],\n[\n\"19\",\n\"Позицию, которую РТК не может завершить, сотрудник доготавливает на оборудовании РТК. При критическом отказе позиции отменяются, возврат денег выполняет Контур\",\n\"Исполнитель не меняется, учет расхода сохраняется\",\n\"ГОСТ Р МЭК 60204-1, 9.2.5.1\"\n]\n]\n}\n];\nconst BOOK = {\"refs\": {\"SR-182\": {\"src\": \"L1\", \"text\": \"При отказе отдельной сборки приготовления РТК должен автоматически переходить в деградированный режим: скрывать из меню позиции, зависящие от отказавшей сборки, и продолжать прием и выполнение заказов по оставшимся доступным позициям.\", \"status\": \"Утверждено\", \"meta\": \"Надежность · FR\"}, \"SR-183\": {\"src\": \"L1\", \"text\": \"РТК должен автоматически восстанавливать рабочее состояние после кратковременного пропадания электропитания длительностью не более 5 минуты без вмешательства персонала.\", \"status\": \"Утверждено\", \"meta\": \"Надежность · FR\"}, \"SR-198\": {\"src\": \"L1\", \"text\": \"РТК должен обеспечивать временное исключение отдельных позиций меню из перечня доступных позиций, передаваемого в хаб интеграции (CS-03.06), без удаления реализации позиции в ПО РТК.\", \"status\": \"Измененное\", \"meta\": \"Меню · FR\"}, \"SR-202\": {\"src\": \"L1\", \"text\": \"РТК должен обеспечивать прием команд удаленного управления (перезапуск подсистем, принудительное скрытие позиций меню, запуск промывки) из диспетчерской системы мониторинга. Доступ к данным функциям определяется документом «Политика доступа к РТК».\", \"status\": \"Утверждено\", \"meta\": \"Интеграции · FR\"}, \"SR-211\": {\"src\": \"L1\", \"text\": \"РТК должен обеспечивать удаленный запуск диагностических тестов отдельных подсистем и сборок без перевода РТК в режим внепланового обслуживания. Доступ к данной функции определяется документом «Политика доступа к РТК».\", \"status\": \"Утверждено\", \"meta\": \"Диагностика · FR\"}, \"SR-270\": {\"src\": \"L1\", \"text\": \"РТК должен обеспечивать автоматический запуск цикла промывки систем подачи жидкостей по настраиваемому расписанию.\", \"status\": \"Утверждено\", \"meta\": \"Эксплуатация · FR\"}, \"SR-285\": {\"src\": \"L1\", \"text\": \"При выходе измеренной массы готового напитка за пределы допусков, определенных технологической картой, РТК должен заблокировать размещение заказа в ячейке выдачи и сформировать запись в журнале событий\", \"status\": \"Утверждено\", \"meta\": \"Приготовление · FR\"}, \"SR-292\": {\"src\": \"L1\", \"text\": \"ПО управления должно принимать от хаба интеграции данные оформленного заказа, включая: перечень выбранных позиций меню с параметрами кастомизации, выбранный тип упаковки горячих кулинарных изделий, опцию «Здесь / С собой», наличие крышки.\", \"status\": \"Измененное\", \"meta\": \"Интеграции · IFR\"}, \"SR-293\": {\"src\": \"L1\", \"text\": \"ПО управления должно принимать от хаба интеграции уведомление об отмене транзакции оплаты (по таймауту или по инициативе покупателя) и отменять соответствующий заказ в очереди приготовления.\", \"status\": \"Утверждено\", \"meta\": \"Интеграции · IFR\"}, \"SR-294\": {\"src\": \"L1\", \"text\": \"ПО управления должно принимать от хаба интеграции подтверждение успешной оплаты заказа перед началом приготовления.\", \"status\": \"Утверждено\", \"meta\": \"Интеграции · IFR\"}, \"SR-299\": {\"src\": \"L1\", \"text\": \"ПО управления должно принимать сигнал о задымлении от пожарной сигнализации магазина по согласованному интерфейсу.\", \"status\": \"Дискуссия\", \"meta\": \"Безопасность · IFR\"}, \"SR-325\": {\"src\": \"L1\", \"text\": \"РТК должен передавать хабу интеграции свой статус доступности и перечень позиций меню, доступных для приготовления в текущий момент.\", \"status\": \"Утверждено\", \"meta\": \"Интеграции · IFR\"}, \"SR-326\": {\"src\": \"L1\", \"text\": \"РТК должен обеспечивать процедуру запроса разрешения на вход персонала в защитную зону посредством нажатия кнопки запроса входа на сервисной панели. При подтверждении запроса РТК должен перевести манипуляторы в парковочное положение, приостановить работу исполнительных устройств, представляющих опасность для персонала, и сформировать сигнал о разрешении входа в защитную зону.\", \"status\": \"Утверждено\", \"meta\": \"Безопасность · FR\"}, \"SR-108.1\": {\"src\": \"L2\", \"text\": \"РТК должен отслеживать состояние каждой ячейки выдачи: свободна, зарезервирована, занята заказом, ожидает освобождения.\", \"status\": \"Утверждено\", \"meta\": \"Выдача заказов · FR\"}, \"SR-109.1\": {\"src\": \"L2\", \"text\": \"РТК должен удерживать дверь каждой ячейки в запертом состоянии во всех режимах, кроме состояния «готов к выдаче» и сервисного обслуживания.\", \"status\": \"Новое\", \"meta\": \"Выдача заказов · FR\"}, \"SR-146.1\": {\"src\": \"L2\", \"text\": \"При обнаружении загрязнения РТК должен формировать уведомление для сотрудника магазина с указанием зоны загрязнения.\", \"status\": \"Утверждено\", \"meta\": \"Эксплуатация · FR\"}, \"SR-160.1\": {\"src\": \"L2\", \"text\": \"Плановый визит сервисного инженера должен выполняться с интервалом не более 30 календарных дней, если документация производителей установленного оборудования не требует более частого обслуживания.\", \"status\": \"Утверждено\", \"meta\": \"Эксплуатация · CON\"}, \"SR-189.1\": {\"src\": \"L2\", \"text\": \"Если сотрудник магазина не подтвердил устранение загрязнения в течение установленного времени после уведомления, РТК должен выполнить эскалацию уведомления диспетчеру.\", \"status\": \"Утверждено\", \"meta\": \"Эксплуатация · FR\"}, \"SR-273.1\": {\"src\": \"L2\", \"text\": \"При пополнении расходных материалов сотрудник магазина должен регистрировать факт пополнения через интерфейс сервисной панели.\", \"status\": \"Утверждено\", \"meta\": \"Эксплуатация · FR\"}, \"SR-325.1\": {\"src\": \"L2\", \"text\": \"РТК должен передавать хабу интеграции (CS-03.06) расчетное количество порций, которое может быть приготовлено в текущий момент, отдельно по каждой позиции меню, с учетом совместного расходования общих ингредиентов и расходных материалов между позициями.\", \"status\": \"Утверждено\", \"meta\": \"Интеграции · FR\"}, \"SR-108.1.4\": {\"src\": \"L3\", \"text\": \"ПО управления должно переводить ячейку в состояние «свободна» после регистрации открытия и закрытия двери покупателем и снижения показания датчика наличия заказа ниже порога.\", \"status\": \"Утверждено\", \"meta\": \"Выдача заказов · FR\"}, \"SR-109.1.2\": {\"src\": \"L3\", \"text\": \"При отсутствии напряжения питания на замке дверь ячейки должна разблокироваться.\", \"status\": \"Утверждено\", \"meta\": \"Выдача заказов · CON\"}, \"SR-110.5.1\": {\"src\": \"L3\", \"text\": \"ПО должно предоставлять сотруднику магазина на сервисной панели функцию отпирания ячейки с истекшим сроком для утилизации заказа.\", \"status\": \"Утверждено\", \"meta\": \"Выдача заказов · FR\"}, \"SR-110.5.2\": {\"src\": \"L3\", \"text\": \"ПО должно переводить заказ в состояние «утилизирован» после закрытия двери ячейки, отпертой по SR-110.5.1, при отсутствии заказа на посадочной платформе по данным датчика наличия заказа.\", \"status\": \"Новое\", \"meta\": \"Выдача заказов · FR\"}, \"SR-136.8.3\": {\"src\": \"L3\", \"text\": \"Посадочная поверхность платформы должна иметь посадочные места под предметы заказа: не менее двух гнезд под стаканы из перечня SKU и посадочное место под упакованное кулинарное изделие, удерживающие предметы от смещения при движении платформы.\", \"status\": \"Утверждено\", \"meta\": \"Выдача заказов · FR\"}, \"SR-325.1.2\": {\"src\": \"L3\", \"text\": \"ПО управления должно уменьшать расчетные остатки по всем позициям, зависящим от израсходованного ресурса, по факту приготовления каждой порции.\", \"status\": \"Утверждено\", \"meta\": \"Интеграции · FR\"}, \"SS-05.02\": {\"src\": \"PBS\", \"text\": \"ПО управления подсистемой выдачи заказов. Программное обеспечение для управления замками дверей, датчиками состояния и наличия заказа, приводом выдвижной посадочной платформы, а также для рендеринга экрана ячейки (номер, состав, статус); предоставляет API для интеграции с внешними системами управления\", \"status\": \"Согласовано\", \"meta\": \"Сборка\"}, \"SS-07.06\": {\"src\": \"PBS\", \"text\": \"ПО диагностики, телеметрии и удаленного мониторинга. Сбор телеметрии со всех подсистем, журналирование, передача в диспетчерскую, интерфейс удаленного управления\", \"status\": \"Согласовано\", \"meta\": \"Сборка\"}, \"SS-07.07\": {\"src\": \"PBS\", \"text\": \"ПО системы компьютерного зрения для контроля загрязнений и качества выпускаемой продукции. Контроль разбросанных стаканов и крышек, контроль загрязнений на рабочих поверхностях, стенках, оборудовании и полу, контроль приготовления и качества напитков.\", \"status\": \"Новое\", \"meta\": \"Сборка\"}, \"SS-07.10\": {\"src\": \"PBS\", \"text\": \"ПО обеспечения функциональной безопасности. Программное обеспечение для промышленного контроллера безопасности: конфигурация логики безопасного останова, управление безопасными режимами манипуляторов\", \"status\": \"Согласовано\", \"meta\": \"Сборка\"}, \"SS-13.03\": {\"src\": \"PBS\", \"text\": \"Кнопка аварийного останова. Немедленное обесточивание всех движущихся частей\", \"status\": \"Согласовано\", \"meta\": \"Компонент\"}, \"SS-13.05\": {\"src\": \"PBS\", \"text\": \"Контроллер функциональной безопасности. Сертифицированный контроллер, независимый от промышленного компьютера\", \"status\": \"Согласовано\", \"meta\": \"Сборка\"}, \"SS-15.03\": {\"src\": \"PBS\", \"text\": \"Защитное ограждение рабочей зоны. Физический барьер, разделяющий зону работы манипуляторов и зоны доступа персонала и покупателей. Для функционала Группы A является основным средством защиты людей от движущихся частей манипуляторов в рабочем режиме\", \"status\": \"Согласовано\", \"meta\": \"Сборка\"}, \"SS-17.05.01\": {\"src\": \"PBS\", \"text\": \"Локальный контроллер станции напитков. Обеспечивает выполнение локальных управляющих операций станции по командам системы управления РТК, сбор состояний технологического оборудования и формирование результатов выполнения операций.\", \"status\": \"Согласовано\", \"meta\": \"Подсистема\"}, \"QQ-73\": {\"src\": \"Открытые вопросы\", \"text\": \"Дополнить SR требованиями по категории остановки (ГОСТ Р МЭК 60204-1). Пересмотреть требование об аварийной остановке путем немедленного обесточивания приводов и заменить эту формулировку на остановку по определенной категории. Проработать требование по безопасной остановке и связать ее с категорией остановки по ГОСТ. Проработать термины \\\"парковочное\\\" и \\\"безопасное\\\" положение манипулятора. Проработать порядок, в какой последовательности части РТК принимают безопасные состояния.\\nКомментарий: Проработать Катеришич М.Ю.\", \"status\": \"Открыт\", \"meta\": \"Источник: SR-137\"}, \"QQ-109\": {\"src\": \"Открытые вопросы\", \"text\": \"Какие способы обнаружения разгерметизации холодильного контура должны применяться в SS-17.02 и требуется ли прямое обнаружение хладагента либо допускается диагностика по параметрам работы системы охлаждения?\\nКомментарий: вопрос для формирования требований к холодильнику станции напитков\", \"status\": \"Открыт\", \"meta\": \"\"}, \"QQ-110\": {\"src\": \"Открытые вопросы\", \"text\": \"Какое безопасное состояние должно устанавливаться при подтвержденной или предполагаемой разгерметизации холодильного контура и при отказе средств ее обнаружения?\\nКомментарий: вопрос для формирования требований к холодильнику станции напитков\", \"status\": \"Открыт\", \"meta\": \"\"}, \"QQ-119\": {\"src\": \"Открытые вопросы\", \"text\": \"Можем ли мы обеспечить учет остатков РТК по кофе и молоку, если в целевом решении РТК вышел из строя и человек заходит в зону и самостоятельно готовит напиток на кофемашине?\", \"status\": \"Открыт\", \"meta\": \"\"}, \"H-01.05\": {\"src\": \"Реестр рисков РТК\", \"text\": \"Опасность: Разбрызгивание горячей жидкости при транспортировке стакана\\nОпасная ситуация: Манипулятор перемещает открытый стакан с горячим напитком (до надевания крышки) на высоте, при которой капли могут попасть на человека\\nОпасное событие: Резкое ускорение или торможение манипулятора приводит к расплескиванию горячей жидкости за пределы стакана\", \"status\": \"Начальный риск R6\", \"meta\": \"Термическая\"}, \"H-01.06\": {\"src\": \"Реестр рисков РТК\", \"text\": \"Опасность: Непреднамеренное движение манипулятора\\nОпасная ситуация: Человек находится вблизи манипулятора, считая его остановленным (пауза между операциями, деградированный режим)\\nОпасное событие: Сбой ПО, электромагнитные помехи или восстановление питания после кратковременного отключения вызывают незапланированное движение\", \"status\": \"Начальный риск R6\", \"meta\": \"Механическая\"}, \"H-05.01\": {\"src\": \"Реестр рисков РТК\", \"text\": \"Опасность: Неожиданное движение манипулятора при подаче питания для диагностики\\nОпасная ситуация: Манипулятор остановлен в произвольном положении после аварийного останова; инженер восстанавливает питание для запуска диагностических процедур\\nОпасное событие: Манипулятор выполняет буферизованную команду или начинает возврат в домашнюю позицию без предупреждения\", \"status\": \"Начальный риск R9\", \"meta\": \"Механическая\"}, \"IF-RTK-08\": {\"src\": \"Реестр интерфейсов РТК\", \"text\": \"Сторона A: ПО управления захватными устройствами (SS-01.05)\\nСторона B: Захват для стаканов (SS-01.03)\\nНаправление: A↔B\\nСодержание обмена: Позиция, усилие и скорость губок, наличие объекта, счетчик циклов смыкания\\nТребование A: — (Не написано)\\nТребование B: SR-135.3.4, SR-135.3.14, SR-135.3.32 (Не написано)\\nКомментарий: Управление недоступно при выключенном манипуляторе. Скорость губок в API A2 не опубликована\", \"status\": \"Черновик\", \"meta\": \"Информационный · Modbus RTU через tool I/O манипулятора · ICD-RTK-TOOL\"}}, \"glossary\": {\"Критический отказ\": \"Состояние, при котором продолжение работы создает угрозу безопасности людей, пищевой безопасности или сохранности оборудования. Примеры: задымление, неконтролируемый нагрев, отказ контроллера безопасности, отказ электрозащиты\"}};\n\n/* Разбор документа модели: DOC — блоки docx по порядку, BOOK — формулировки из книги требований.\n   Разделы ищутся по заголовкам третьего уровня, поэтому порядок разделов в документе не важен */\nconst SEC = {};\n(() => {\n  let cur = null;\n  DOC.forEach(b => {\n    if (b.k === 'p' && /^Heading 3/.test(b.style)){ cur = SEC[b.t] = []; return; }\n    if (cur) cur.push(b);\n  });\n})();\nconst secName = pre => Object.keys(SEC).find(k => k.startsWith(pre));\nfunction sec(pre){\n  const k = secName(pre);\n  if (!k) throw new Error('В модели нет раздела «' + pre + '»');\n  return SEC[k];\n}\nconst secTable = (pre, i = 0) => sec(pre).filter(b => b.k === 't')[i].rows;\nconst secItems = pre => sec(pre).filter(b => b.k === 'p' && b.list).map(b => b.t);\nconst secParas = pre => sec(pre).filter(b => b.k === 'p' && !b.list).map(b => b.t);\n\nconst MODES = {};\nconst ORDER = [];\nsecTable('Режимы').slice(1).forEach(r => {\n  const key = r[0] === '—' ? 'OFF' : r[0];\n  ORDER.push(key);\n  MODES[key] = {disp:r[0], name:r[1], purpose:r[2], accept:r[3], motion:r[4], person:r[5], issue:r[6], hub:r[7], time:r[8]};\n});\nconst FLABEL = {accept:'Прием', motion:'Приводы опасных движений', person:'Человек в зоне', issue:'Выдача из ячеек', hub:'Статус для хаба', time:'Учет времени'};\n\nconst KINDS = {1:'human',2:'human',3:'remote',4:'auto',5:'safety',6:'human',7:'human',8:'human',9:'remote',10:'safety',11:'excluded',12:'human',13:'human',14:'human',15:'human',16:'human',17:'human',18:'human',19:'human',20:'human',21:'auto',22:'human',23:'human',24:'human',25:'human',26:'auto'};\nconst KIND = {human:'действие человека на месте', auto:'автоматически', remote:'автоматически или удаленно', safety:'функция безопасности', excluded:'исключен'};\nconst ends = s => s === 'Выключен' ? ['OFF'] : s === 'Любой' ? ['*'] : s === 'Прежний или M-06' ? ['M-06'] : s === '—' ? [] : s.split(',').map(x => x.trim().replace(/\\.(x|y)$/, ''));\nconst T = secTable('Переходы').slice(1).map(r => {\n  const n = +r[0].slice(2);\n  return {n, id:r[0], fromL:r[1], toL:r[2], from:ends(r[1]), to:ends(r[2]), who:r[3], cond:r[4], act:r[5], kind:KINDS[n]};\n});\nconst TM = Object.fromEntries(T.map(t => [t.n, t]));\n\nconst FLAGS = {u1:{name:'Условие пуска У-1'}};\n['crit','empty','local'].forEach((k, i) => { const r = secTable('Признаки РТК')[i + 1]; FLAGS[k] = {name:r[0], set:r[1], clear:r[2], act:r[3]}; });\nconst FLAG_ORDER = ['u1','crit','empty','local'];\nconst FLAG_T = {u1:[12,16,19], crit:[3,4,9,12,14,15,16,17,18,19,20,26], empty:[12,16,19], local:[]};\n\n/* Категории цвета: [категория, краткая подпись на схеме] */\nconst SC = {\n  'OFF':{hub:['none','Нет связи'], time:['none','Не учитывается'], motion:['none','Обесточены']},\n  'M-01':{hub:['none','Вне графика или недоступен'], time:['none','Организационный простой'], motion:['none','Обесточены']},\n  'M-02':{hub:['off','Недоступен'], time:['part','Как у режима входа'], motion:['ok','Автоматически, запуск']},\n  'M-03':{hub:['ok','Доступен или прием приостановлен'], time:['ok','Рабочее или по причинам П1'], motion:['ok','Автоматически']},\n  'M-04.1':{hub:['off','Недоступен'], time:['pause','Плановый простой'], motion:['none','Обесточены']},\n  'M-04.2':{hub:['off','Недоступен'], time:['off','Внеплановый простой'], motion:['none','Обесточены']},\n  'M-05.1':{hub:['off','Недоступен'], time:['pause','Плановый простой'], motion:['part','Ручное, тестовый цикл']},\n  'M-05.2':{hub:['off','Недоступен'], time:['off','Внеплановый простой'], motion:['part','Ручное, тестовый цикл']},\n  'M-05.3':{hub:['off','Недоступен'], time:['pause','Плановый простой'], motion:['part','Ручное, тестовый цикл']},\n  'M-06':{hub:['off','Недоступен'], time:['part','По причине входа'], motion:['off','Обесточены до пуска на месте']}\n};\nconst LEG = {\n  hub:[['ok','Доступен или прием приостановлен'],['off','Недоступен'],['none','Вне графика или нет связи']],\n  time:[['ok','Рабочее время'],['pause','Плановый простой'],['off','Внеплановый простой'],['none','Организационный или не учитывается'],['part','По режиму или причине входа']],\n  motion:[['ok','Автоматически'],['part','Ручное и тестовый цикл'],['none','Обесточены'],['off','Обесточены до пуска на месте']]\n};\n\n/* Белый список удаленных команд по режимам. Не названное — недопустимо.\n   Разметка сопоставляется с таблицей модели по началу названия команды */\nconst RCOLS = ['M-01','M-02','M-03','M-04','M-05.1','M-05.2','M-05.3','M-06'];\nconst ALLY = Object.fromEntries(RCOLS.map(c => [c, ['y']]));\nconst W03 = ['c','при П2 = «Ожидание»'];\nconst RCELLS = [\n  ['Приостановить прием', {'M-03':['y']}],\n  ['Возобновить прием', {'M-03':['y']}],\n  ['Скрыть позицию', ALLY],\n  ['Вернуть позицию', ALLY],\n  ['Промывка трактов', {'M-03':W03}],\n  ['Перезапуск ПО без приводов', Object.assign({}, ALLY, {'M-03':W03})],\n  ['Перезапуск подсистемы с приводами', {'M-03':W03}],\n  ['Перезапуск контроллера', {'M-03':['c','при П2 = «Ожидание», ведет в M-06 по T-10']}],\n  ['Диагностический тест без движения', {'M-03':W03, 'M-05.2':['y']}],\n  ['Диагностический тест с движением', {'M-03':W03}],\n  ['Сценарий восстановления', {'M-03':['c','при П2 = «Восстановление»']}],\n  ['Установить отметку', Object.fromEntries(RCOLS.filter(c => c !== 'M-02').map(c => [c, ['y']]))],\n  ['Блокировка возобновления', ALLY]\n];\nfunction cellsFor(cmd){\n  const e = RCELLS.find(([p]) => cmd.startsWith(p));\n  if (!e) console.warn('Нет разметки для удаленной команды:', cmd);\n  return e ? e[1] : {};\n}\nconst RCMD = secTable('Удаленные команды').slice(1).map(r => ({cmd:r[0], allow:r[1], danger:r[2], basis:r[3], cells:cellsFor(r[0])}));\n/* Подпись по столбцу «Опасная» для команды в данном режиме */\nfunction dangerOf(r, col){\n  const d = r.danger;\n  if (/^Нет/.test(d)) return '';\n  if (/^Да в M-03/.test(d)) return col === 'M-03' ? 'опасная' : '';\n  if (/^Да/.test(d)) return 'опасная';\n  if (/снятие — да/.test(d)) return 'снятие опасное';\n  return '';\n}\n\n/* Геометрия схемы, единицы viewBox 1260 x 900 */\nconst COMPS = [\n  {id:'M-04', x:290, y:90, w:290, h:300, title:'M-04 · Обслуживание персоналом', tx:304, ty:112},\n  {id:'M-05', x:30, y:560, w:600, h:240, title:'M-05 · Инженерный', tx:300, ty:786}\n];\nconst NODES = [\n  {id:'OFF', x:40, y:14, w:200, h:62},\n  {id:'M-01', x:40, y:120, w:200, h:74},\n  {id:'M-04.1', x:320, y:132, w:230, h:74},\n  {id:'M-04.2', x:320, y:280, w:230, h:74},\n  {id:'M-02', x:650, y:132, w:200, h:74},\n  {id:'M-03', x:930, y:132, w:260, h:74},\n  {id:'M-05.1', x:40, y:646, w:150, h:74},\n  {id:'M-05.3', x:205, y:646, w:150, h:74},\n  {id:'M-05.2', x:440, y:646, w:170, h:74},\n  {id:'M-06', x:700, y:610, w:260, h:90}\n];\nconst PSEUDO = [{t:21, x:1010, y:640, w:190, h:32, label:'Восстановление питания'}];\nconst FBOX = {x:985, y:700, w:215, h:118, title:'У-1 и признаки РТК'};\n/* p — ломаные, b — центры номеров. Порядок задает наложение: позже нарисованная линия проходит поверх с разрывом */\nconst EDGES = [\n  {t:22, p:[[[100,76],[100,120]]], b:[[100,98]]},\n  {t:23, p:[[[180,120],[180,76]]], b:[[180,98]]},\n  {t:1, p:[[[240,148],[320,148]]], b:[[280,148]]},\n  {t:14, p:[[[320,182],[240,182]]], b:[[280,182]]},\n  {t:13, p:[[[435,280],[435,206]]], b:[[435,243]]},\n  {t:12, p:[[[580,169],[650,169]]], b:[[615,169]]},\n  {t:4, p:[[[850,169],[930,169]]], b:[[890,169]]},\n  {t:6, p:[[[1040,132],[1040,58],[535,58],[535,132]]], b:[[790,58]]},\n  {t:7, p:[[[985,132],[985,74],[565,74],[565,300],[550,300]]], b:[[565,243]]},\n  {t:17, p:[[[55,560],[55,194]]], b:[[55,300]]},\n  {t:24, p:[[[225,194],[225,646]], [[330,390],[330,646]]], b:[[225,300],[330,600]]},\n  {t:2, p:[[[85,194],[85,646]], [[300,390],[300,520],[150,520],[150,646]]], b:[[85,420],[300,430]]},\n  {t:26, p:[[[500,390],[500,646]]], b:[[500,430]]},\n  {t:3, p:[[[130,194],[130,470],[460,470],[460,646]], [[725,206],[725,530],[590,530],[590,646]]], b:[[130,360],[725,360]]},\n  {t:16, p:[[[560,560],[560,500],[690,500],[690,206]]], b:[[690,260]]},\n  {t:5, p:[[[760,206],[760,610]]], b:[[760,450]]},\n  {t:19, p:[[[830,610],[830,206]]], b:[[830,300]]},\n  {t:10, p:[[[950,206],[950,610]]], b:[[950,450]]},\n  {t:18, p:[[[700,630],[640,630],[640,330],[550,330]]], b:[[640,410]]},\n  {t:20, p:[[[700,690],[610,690]], [[540,390],[540,646]]], b:[[655,690],[540,610]]},\n  {t:15, p:[[[355,700],[440,700]]], b:[[397,700]], both:true},\n  {t:21, p:[[[1010,656],[960,656]]], b:[[985,656]]},\n  {t:9, p:[[[1190,190],[1215,190],[1215,830],[525,830],[525,720]]], b:[[900,830]]},\n  {t:25, p:[[[1190,170],[1230,170],[1230,850],[280,850],[280,720]]], b:[[700,850]]},\n  {t:8, p:[[[1190,150],[1245,150],[1245,870],[110,870],[110,720]]], b:[[500,870]]}\n];\n\n/* Обзор: стрелки между режимами верхнего уровня. Несколько переходов между одной парой режимов объединены */\nconst AGG = [\n  {id:'a1', lbl:'Выключен ↔ M-01', t:[22,23], kind:'normal', p:[[[100,76],[100,120]],[[180,120],[180,76]]]},\n  {id:'a2', lbl:'M-01 → M-04', t:[1], kind:'cycle', p:[[[240,148],[320,148]]]},\n  {id:'a3', lbl:'M-04 → M-01', t:[14], kind:'cycle', p:[[[320,182],[240,182]]]},\n  {id:'a4', lbl:'M-04 → M-02', t:[12], kind:'cycle', p:[[[580,169],[650,169]]]},\n  {id:'a5', lbl:'M-02 → M-03', t:[4], kind:'cycle', p:[[[850,169],[930,169]]]},\n  {id:'a6', lbl:'M-03 → M-04', t:[6,7], kind:'cycle', p:[[[1040,132],[1040,58],[535,58],[535,90]]], pill:[790,58]},\n  {id:'a7', lbl:'M-01 → M-05', t:[2,3,24], kind:'normal', p:[[[130,194],[130,560]]], pill:[130,380]},\n  {id:'a8', lbl:'M-05 → M-01', t:[17], kind:'normal', p:[[[55,560],[55,194]]]},\n  {id:'a9', lbl:'M-04 → M-05', t:[2,24,26,20], kind:'normal', p:[[[330,390],[330,560]]], pill:[330,475]},\n  {id:'a10', lbl:'M-02 → M-05', t:[3], kind:'remote', p:[[[725,206],[725,530],[590,530],[590,560]]]},\n  {id:'a11', lbl:'M-05 → M-02', t:[16], kind:'normal', p:[[[560,560],[560,500],[690,500],[690,206]]]},\n  {id:'a12', lbl:'M-02 → M-06', t:[5], kind:'safety', p:[[[760,206],[760,610]]]},\n  {id:'a13', lbl:'M-06 → M-02', t:[19], kind:'normal', p:[[[830,610],[830,206]]]},\n  {id:'a14', lbl:'M-03 → M-06', t:[10], kind:'safety', p:[[[950,206],[950,610]]]},\n  {id:'a15', lbl:'M-06 → M-04', t:[18], kind:'normal', p:[[[700,630],[640,630],[640,330],[580,330]]]},\n  {id:'a16', lbl:'M-06 → M-05', t:[20], kind:'normal', p:[[[700,690],[630,690]]]},\n  {id:'a17', lbl:'M-03 → M-05', t:[8,9,25], kind:'normal', p:[[[1190,170],[1230,170],[1230,840],[520,840],[520,800]]], pill:[900,840]},\n  {id:'a18', lbl:'Восстановление питания → M-06', t:[21], kind:'normal', p:[[[1010,656],[960,656]]]}\n];\nconst AM = Object.fromEntries(AGG.map(a => [a.id, a]));\n\n/* Слои: что показывают цвет и подпись блока */\nconst remoteCount = id => {\n  if (id === 'OFF') return 0;\n  const col = rcol(id);\n  return col ? RCMD.filter(r => cellOf(r, col)[0] !== 'n').length : 0;\n};\nconst LAYERS = {\n  safety:{key:'motion', legend:LEG.motion},\n  time:{key:'time', legend:LEG.time},\n  hub:{key:'hub', legend:LEG.hub},\n  remote:{key:'remote', legend:[['ok','10 и более команд'],['part','6–9 команд'],['none','5 и менее команд'],['off','Нет связи']]}\n};\nfunction layerCat(id){\n  if (layer === 'remote'){\n    const n = remoteCount(id);\n    return id === 'OFF' ? ['off','Нет связи'] : [n >= 10 ? 'ok' : n >= 6 ? 'part' : 'none', 'Команд: ' + n];\n  }\n  return SC[id][LAYERS[layer].key];\n}\n/* Причины П1, сгруппированные по категории учета времени */\nfunction causesByAccount(){\n  const rows = secTable('Причины П1').slice(1), cats = ['Внеплановый простой','Организационный простой','Плановый простой'];\n  const g = cats.map(c => [c, rows.filter(r => r[3] === c).map(r => r[0])]);\n  const other = rows.filter(r => !cats.includes(r[3]));\n  return `<dl class=\"kv\">${g.map(([c, xs]) => `<dt>${esc(c)}<\/dt><dd>${esc(xs.join(', '))}<\/dd>`).join('')}${other.map(r => `<dt>${esc(r[0])}<\/dt><dd>${lx(r[3])}<\/dd>`).join('')}<\/dl>`;\n}\nconst PR = () => secItems('Принципы');\nconst LAYER_INFO = {\n  safety:() => `<h3>Слой «Безопасность»<\/h3><p>Цвет показывает состояние приводов опасных движений. Блок «У-1 и признаки РТК» в правом нижнем углу схемы открывает условие пуска и признаки.<\/p><ol>${[5,6,7,8,10].map(n => `<li value=\"${n}\">${lx(PR()[n - 1])}<\/li>`).join('')}<\/ol>`,\n  remote:() => `<h3>Слой «Удаленное управление»<\/h3><p>Подпись на блоке показывает, сколько удаленных команд допустимо в режиме. Команды и режимы вне белого списка недопустимы. Точечная стрелка — переход, который может выполнить диспетчер. Полная матрица команд есть в справочнике.<\/p><p>${lx(secItems('Удаленные команды')[0])}<\/p>`,\n  time:() => `<h3>Слой «Учет времени»<\/h3><p>${lx(PR()[8])}<\/p><h4>Причины П1 в M-03<\/h4>${causesByAccount()}<p>${lx(secParas('Причины П1')[0])}<\/p><h4>${esc(secParas('Причины П1')[1].replace(/\\.$/, ''))}<\/h4><ul>${secItems('Причины П1').map(x => `<li>${lx(x)}<\/li>`).join('')}<\/ul>`,\n  hub:() => `<h3>Слой «Статус для хаба»<\/h3><p>Цвет и подпись показывают статус, который РТК передает хабу интеграции.<\/p>`\n};\n\n/* Сценарии для ознакомления.\n   src: 'model' — шаги взяты дословно из текста модели, разметка s и t только подсвечивает схему.\n   src: 'derived' — шаги составлены из переходов и режимов модели.\n   s — режимы шага, t — переходы шага */\nconst MSCEN = (() => {\n  const out = {};\n  let cur = null;\n  sec('Сценарии').forEach(b => {\n    if (b.k !== 'p') return;\n    if (!b.list){ cur = out[b.t] = []; return; }\n    if (cur) cur.push(b.t);\n  });\n  return out;\n})();\nfunction fromModel(name, from, items, marks){\n  if (items.length !== marks.length) console.warn('Сценарий «' + name + '»: пунктов в модели ' + items.length + ', разметки ' + marks.length);\n  return {name, src:'model', from, steps:items.map((x, i) => Object.assign({x}, marks[i] || {}))};\n}\nconst SCEN = [\n  {name:'Рабочий день', src:'derived', steps:[\n    {s:'M-01', x:'Вне графика РТК находится в дежурном режиме: хранение, контроль температуры и протечек, связь. Приводы обесточены.'},\n    {t:1, x:'Сотрудник проходит аутентификацию на сервисной панели. РТК подает сигнал разрешения входа и разблокирует дверь.'},\n    {s:'M-04.1', x:'Ежедневное обслуживание в начале смены: пополнение, проверка сроков, уборка, отходы, извлечение невостребованных заказов и брака.'},\n    {t:12, x:'Пуск по условию У-1: шесть условий, включая отсутствие людей в зоне, закрытую и запертую дверь и известное положение манипуляторов. Работы подтверждены, загруженные продукты зарегистрированы. Сначала сброс, затем команда пуска.'},\n    {s:'M-02', x:'Запуск: возврат к ближайшей ключевой точке со скоростью не более 250 мм/с, исходное положение, прогрев, самопроверка, расчет признаков П1 и П3.'},\n    {t:4, x:'Самопроверка пройдена, отметки «Критический отказ» нет. РТК передает статус хабу и переходит в рабочий режим.'},\n    {s:'M-03', x:'Рабочий режим: прием, п ode>У-1<\/code>Условие пуска<\/button>` : '';\n  return `<div class=\"crumb\">Переход ${t.id} · ${KIND[t.kind]}<\/div>\n    <h3>${esc(label(t))}<\/h3>\n    <dl class=\"kv\"><dt>Инициатор и канал<\/dt><dd>${lx(t.who)}<\/dd><dt>Условие<\/dt><dd>${lx(t.cond)}<\/dd><dt>Действия РТК<\/dt><dd>${lx(t.act)}<\/dd><\/dl>\n    <div class=\"chips\">${u1}${e.map(gotoS).join('')}<\/div>`;\n}\n\nfunction flagHtml(k){\n  const f = FLAGS[k];\n  let body;\n  if (k === 'u1'){\n    const ps = secParas('Условие пуска У-1');\n    body = `<p>${lx(ps[0])}<\/p>${olist(secItems('Условие пуска У-1'))}${ps.slice(1).map(p => `<p class=\"note\">${lx(p)}<\/p>`).join('')}`;\n  } else {\n    body = `<dl class=\"kv\"><dt>Устанавливается<\/dt><dd>${lx(f.set)}<\/dd><dt>Снимается<\/dt><dd>${lx(f.clear)}<\/dd><dt>Действие<\/dt><dd>${lx(f.act)}<\/dd><\/dl>`;\n    if (k === 'crit') body += `<p>${lx(secParas('Критические отказы')[0])}<\/p>${olist(secItems('Критические отказы'))}<p class=\"note\">Словарь книги: ${esc(BOOK.glossary['Критический отказ'] || '')}<\/p>`;\n  }\n  const rt = relList(FLAG_T[k]);\n  return `<div class=\"crumb\">${k === 'u1' ? 'Условие пуска' : 'Признак РТК'}<\/div><h3>${esc(f.name)}<\/h3>${body}${rt.length ? `<div class=\"d-cols\"><div><h4>Связанные переходы<\/h4>${list(rt)}<\/div><\/div>` : ''}`;\n}\n\nconst aggHtml = a => `<div class=\"crumb\">Объединенная стрелка<\/div><h3>${esc(a.lbl)}<\/h3><p>Здесь объединено переходов: ${a.t.length}. Выберите переход, чтобы увидеть условия.<\/p><div class=\"d-cols\"><div>${list(relList(a.t))}<\/div><\/div>`;\n\nfunction scenHtml(){\n  const sc = SCEN[scen.i], st = sc.steps[scen.step], n = sc.steps.length, last = scen.step === n - 1;\n  const head = st.s.length ? st.s.map(k => `${esc(MODES[k].disp)} · ${esc(MODES[k].name)}`).join(' или ')\n    : st.t.map(x => TM[x].id).join(', ') + (st.t.length === 1 ? ' · ' + esc(label(TM[st.t[0]])) : '');\n  const tl = [...new Set([...st.t, ...[...st.x.matchAll(/T-(\\d+)/g)].map(m => +m[1])])].filter(x => TM[x]);\n  const note = sc.src === 'model'\n    ? `Шаги сценария — текст модели, ${esc(sc.from)}. Подсветка на схеме добавлена для ознакомления.`\n    : 'Сценарий составлен из переходов модели для ознакомления. Норма задана таблицами модели.';\n  return `<div class=\"crumb\">Сценарий · шаг ${scen.step + 1} из ${n}<\/div>\n    <h3>${esc(sc.name)}<\/h3>\n    <p><b>${head}<\/b><\/p>\n    <p>${lx(st.x)}<\/p>\n    <div class=\"nav\"><button type=\"button\" data-act=\"prev\"${scen.step === 0 ? ' disabled' : ''}>Назад<\/button><button type=\"button\" class=\"primary\" data-act=\"${last ? 'end' : 'next'}\">${last ? 'Завершить' : 'Далее'}<\/button>${last ? '' : '<button type=\"button\" data-act=\"end\">Выйти<\/button>'}<\/div>\n    <div class=\"chips\">${st.s.map(gotoS).join('')}${tl.map(gotoT).join('')}<\/div>\n    <p class=\"note\">${note}<\/p>`;\n}\n\nfunction renderCard(){\n  const c = $('#card');\n  const back = '<button type=\"button\" class=\"back\" data-act=\"ov\">← К обзору<\/button>';\n  if (scen) c.innerHTML = scenHtml();\n  else if (!sel) c.innerHTML = introHtml();\n  else if (sel.k === 's') c.innerHTML = back + modeHtml(sel.id);\n  else if (sel.k === 't') c.innerHTML = back + transHtml(TM[sel.n]);\n  else if (sel.k === 'f') c.innerHTML = back + flagHtml(sel.id);\n  else c.innerHTML = back + aggHtml(AM[sel.id]);\n}\n\nfunction apply(){\n  const svg = $('#sm');\n  const onT = new Set(), onS = new Set(), onA = new Set(), trT = new Set(), trS = new Set(), cur = new Set();\n  const addS = (x, set) => { if (!MODES[x]) return; set.add(x); if (par(x)) set.add(par(x)); };\n  const addT = (t, ts, ss) => { ts.add(t.n); t.from.concat(t.to).forEach(x => addS(x, ss)); };\n  if (scen){\n    const st = SCEN[scen.i].steps;\n    st.slice(0, scen.step).forEach(s => { s.t.forEach(n => addT(TM[n], trT, trS)); s.s.forEach(k => addS(k, trS)); });\n    const c = st[scen.step];\n    c.t.forEach(n => addT(TM[n], onT, onS));\n    c.s.forEach(k => { addS(k, onS); cur.add(k); });\n  } else if (sel){\n    if (sel.k === 's'){\n      cur.add(sel.id); addS(sel.id, onS);\n      T.forEach(t => { if (t.kind !== 'excluded' && ((t.from[0] !== '*' && rel(t.from, sel.id)) || rel(t.to, sel.id))) addT(t, onT, onS); });\n    } else if (sel.k === 't') addT(TM[sel.n], onT, onS);\n    else if (sel.k === 'f') relList(FLAG_T[sel.id]).forEach(t => addT(t, onT, onS));\n    else { onA.add(sel.id); relList(AM[sel.id].t).forEach(t => addT(t, onT, onS)); }\n  }\n  svg.classList.toggle('has-sel', !!(scen || sel));\n  svg.querySelectorAll('.node').forEach(g => {\n    const id = g.dataset.s;\n    g.classList.toggle('on', onS.has(id));\n    g.classList.toggle('trail', !onS.has(id) && trS.has(id));\n    g.classList.toggle('cur', cur.has(id));\n  });\n  svg.querySelectorAll('.tr').forEach(g => { const n = +g.dataset.t; g.classList.toggle('on', onT.has(n)); g.classList.toggle('trail', !onT.has(n) && trT.has(n)); });\n  svg.querySelectorAll('.ag').forEach(g => g.classList.toggle('on', onA.has(g.dataset.a)));\n  svg.querySelectorAll('.pseudo').forEach(g => g.classList.toggle('on', onT.has(+g.dataset.t)));\n  svg.querySelectorAll('.fl').forEach(g => { const c = !!sel && sel.k === 'f' && sel.id === g.dataset.f; g.classList.toggle('on', c); g.classList.toggle('cur', c); });\n  document.querySelectorAll('#tm tbody tr').forEach(r => r.classList.toggle('sel', !!sel && sel.k === 's' && r.dataset.s === sel.id));\n  document.querySelectorAll('#tt tbody tr').forEach(r => r.classList.toggle('sel', !!sel && sel.k === 't' && +r.dataset.t === sel.n));\n  renderCard();\n}\n\nfunction clearScen(){ scen = null; $('#scen').value = ''; }\nfunction select(s){\n  clearScen();\n  sel = s;\n  if (s && s.k !== 'a') view = 'dt';\n  paint(); apply();\n}\nfunction pickAgg(id){\n  const a = AM[id];\n  if (a.t.length === 1) select({k:'t', n:a.t[0]});\n  else { clearScen(); sel = {k:'a', id}; view = 'ov'; paint(); apply(); }\n}\nfunction toOverview(){ clearScen(); sel = null; view = 'ov'; paint(); apply(); }\nfunction startScen(i){ sel = null; scen = {i, step:0}; view = 'dt'; paint(); apply(); }\nfunction stepScen(d){\n  if (!scen) return;\n  scen.step = Math.max(0, Math.min(SCEN[scen.i].steps.length - 1, scen.step + d));\n  apply();\n}\nfunction focusCard(){\n  try { if (window.matchMedia('(max-width: 1199px)').matches) $('#card').scrollIntoView({block:'nearest', behavior: reduceMotion() ? 'auto' : 'smooth'}); } catch(e){}\n}\n\nfunction tableHtml(rows, o = {}){\n  const [h, ...b] = rows;\n  return `<thead><tr>${h.map(c => `<th>${esc(c)}<\/th>`).join('')}<\/tr><\/thead><tbody>${b.map((r, i) => `<tr${o.attr ? o.attr(r, i) : ''}>${r.map((c, j) => `<td${o.idcol && j === 0 ? ' class=\"id\"' : ''}>${o.cell ? o.cell(c, j, r) : lx(c)}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody>`;\n}\nconst html = (s, v) => { $(s).innerHTML = v; };\n\n/* Особые таблицы справочника: строки режимов и переходов открывают схему, команды показаны матрицей */\nconst T_MODES = rows => `<div class=\"tscroll\"><table class=\"wide\" id=\"tm\">${tableHtml(rows, {idcol:true, attr:r => {\n  const k = r[0] === '—' ? 'OFF' : r[0];\n  const cls = par(k) ? 'sub' : (isComp(k) ? 'parent' : '');\n  return ` data-s=\"${k}\" tabindex=\"0\"${cls ? ` class=\"${cls}\"` : ''}`;\n}})}<\/table><\/div>`;\nconst T_TRANS = rows => `<div class=\"tscroll\"><table class=\"wide\" id=\"tt\">${tableHtml(rows, {idcol:true, attr:r => r[0] === 'T-11' ? ' class=\"x\"' : ` data-t=\"${+r[0].slice(2)}\" tabindex=\"0\"`})}<\/table><\/div>`;\nfunction T_MATRIX(){\n  const W = {y:'Да', c:'Да', n:'Нет'};\n  return `<div class=\"mlegend\"><span class=\"cell c-y\">Да<\/span>допустима<span class=\"cell c-c\">Да<\/span>допустима при условии<span class=\"cell c-n\">Нет<\/span>вне белого списка. В режиме «Выключен» связи нет. Столбцы режимов построены по столбцу «Допустима» модели.<\/div>\n  <div class=\"tscroll\"><table class=\"matrix\" id=\"tr\"><thead><tr><th>Команда<\/th>${RCOLS.map(c => `<th class=\"m\">${c}<small>${esc(MODES[c].name)}<\/small><\/t label>\n    <button type=\"button\" class=\"reset\" id=\"steps\">Порядок обработки по шагам<\/button>\n    <div class=\"legend\" id=\"legend\"><\/div>\n  <\/div>\n\n  <div class=\"main\">\n    <figure class=\"diagram\" id=\"fig\">\n      <div class=\"scroll\">\n        <svg id=\"es\" viewBox=\"0 0 1200 650\" role=\"group\" aria-label=\"Схема эскалации: аппарат, платформа, Тех-бот, руководитель сервиса, дежурный и направления эскалации\"><\/svg>\n      <\/div>\n    <\/figure>\n    <aside class=\"side\" id=\"card\" aria-live=\"polite\"><\/aside>\n  <\/div>\n\n  <details class=\"refblock\" id=\"ref\" open>\n    <summary>Справочник<span>порядок обработки, направления, матрица, закрытие<\/span><\/summary>\n    <div class=\"tabs\" role=\"tablist\" aria-label=\"Разделы справочника\" id=\"tabs\"><\/div>\n    <div id=\"tabps\"><\/div>\n  <\/details>\n\n  <footer>Данные — model/ips-model.js, раздел M.esc: IPLAYSMART совпадает с приложением Д документа «IPS_ Концепция эксплуатации», инциденты РТК составлены по разделу 5.2 и приложению Е «РТК: Концепция эксплуатации» и требуют утверждения. Сроки реакции и закрытия не определены.<\/footer>\n<\/div>\n<script>\nconst E = {\"intro\":[\"Инциденты собираются в платформе мониторинга RB Monitoring и эскалируются диспетчеру-дежурному сервисному инженеру (далее — дежурный). Каждый инцидент дублируется в Тех-бот — группу в Telegram или Max — и задачей в Яндекс Трекер руководителю сервиса.\",\"Дежурный определяет тип инцидента по матрице Д.3, выбирает одно или несколько направлений эскалации и контролирует закрытие инцидента.\"],\"steps\":[\"Аппарат публикует событие или перестает выходить на связь. Платформа мониторинга регистрирует инцидент: аппарат, точку, тип, время и номер заказа, если он есть. Пропадание связи регистрируется, если «health»: false держится дольше 2 мин.\",\"Платформа дублирует инцидент в Тех-бот (группа Telegram или Max) и задачей в Яндекс Трекер руководителю сервиса.\",\"Дежурный принимает инцидент и определяет его тип по матрице Д.3.\",\"Дежурный эскалирует инцидент по одному или нескольким направлениям: СП Тилпос, инженер-интегратор КШ, сотрудник ТТ, выезд сервисного инженера.\",\"Дежурный записывает в инциденте действия, ответы получателей и причину.\",\"Дежурный контролирует закрытие по критериям Д.4 и закрывает инцидент. Тех-бот публикует закрытие.\"],\"sources\":[{\"id\":\"dev\",\"name\":\"Аппарат IPLAYSMART\",\"sub\":\"события, температуры, «health»\"},{\"id\":\"plat\",\"name\":\"Платформа мониторинга\",\"sub\":\"RB Monitoring · регистрирует инцидент\"},{\"id\":\"bot\",\"name\":\"Тех-бот\",\"sub\":\"группа Telegram или Max\"},{\"id\":\"yt\",\"name\":\"Руководитель сервиса\",\"sub\":\"задача в Яндекс Трекере\"},{\"id\":\"duty\",\"name\":\"Диспетчер-дежурный сервисный инженер\",\"sub\":\"принимает решение, контролирует закрытие\"},{\"id\":\"close\",\"name\":\"Закрытие инцидента\",\"sub\":\"критерии Д.4\"}],\"routes\":[{\"id\":\"tilpos\",\"name\":\"СП Тилпос\",\"sub\":\"звонок\",\"ch\":\"Звонок\",\"what\":\"Проблемы касс: POS-терминал, фискальный регистратор, зависание, интерфейс КСО, СБП и другие платежи\",\"give\":\"Точка, номер КСО, время, номер чека или заказа, что видит сотрудник\"},{\"id\":\"ksh\",\"name\":\"Инженер-интегратор КШ\",\"sub\":\"Тех-бот, звонок\",\"ch\":\"Тех-бот, звонок\",\"what\":\"Диагностика по журналам и дампам обмена с платой, анализ первопричины, снятие блокировки на пилоте, обновление агента. При причине на стороне хаба привлекает Интегратора-Тилси\",\"give\":\"Аппарат, время, номер заказа, событие платформы\"},{\"id\":\"tt\",\"name\":\"Сотрудник ТТ\",\"sub\":\"звонок\",\"ch\":\"Звонок\",\"what\":\"Уточнение обстоятельств и дополнительные инструкции: осмотр печи и окна выдачи, извлечение пиццы, сброс ошибок, пополнение, возврат денег покупателю через интерфейс администратора КСО\",\"give\":\"Что проверить и что сделать, кому сообщить результат\"},{\"id\":\"visit\",\"name\":\"Сервисный инженер\",\"sub\":\"выезд или назначение\",\"ch\":\"Выезд дежурного или назначение через руководителя сервиса\",\"what\":\"Ремонт механики, печи, холодильной камеры, устранение замятия, повторная блокировка «нужен техник»\",\"give\":\"Аппарат, точка, код ошибки, что уже сделано на месте\"}],\"second\":[{\"id\":\"tilsi\",\"name\":\"Интегратор-Тилси\",\"sub\":\"второй уровень\",\"from\":\"ksh\",\"what\":\"Расследование невыдачи после оплаты и сбоев связи хаба с аппаратом\"}],\"incidents\":[[\"И-01\",\"Аппарат недоступен\",\"«health»: false дольше 2 мин, нет хартбита\",\"Блокирующий\",\"Проверить, нет ли обрыва связи у нескольких аппаратов. Позвонить в ТТ: есть ли питание, что на экране аппарата\",{\"tt\":\"p\",\"ksh\":\"s\",\"visit\":\"s\"},\"Аппарат на связи, /health «health»: true\"],[\"И-02\",\"Пицца не выдана, блокировка печи\",\"oven_blocked, позиция «не выдан»\",\"Блокирующий\",\"Позвонить в ТТ: осмотреть печь и окно выдачи, извлечь пиццу, подтвердить «камера пуста», вернуть деньги покупателю\",{\"tt\":\"p\",\"ksh\":\"s\",\"visit\":\"s\"},\"Блокировка снята после подтверждения на месте, деньги возвращены\"],[\"И-03\",\"Плата не принимает задачи, «нужен техник»\",\"board_no_ack с блокировкой\",\"Блокирующий\",\"Передать инцидент интегратору КШ для анализа дампа, назначить выезд\",{\"ksh\":\"p\",\"visit\":\"p\",\"tt\":\"s\"},\"Причина устранена, блокировка снята, аппарат в M-02\"],[\"И-04\",\"Блокировка платы не снялась\",\"machine_blocked без machine_unblocked\",\"Блокирующий\",\"Позвонить в ТТ: сбросить ошибки в сервисном меню по инструкции\",{\"tt\":\"p\",\"ksh\":\"s\",\"visit\":\"s\"},\"machine_unblocked, аппарат в M-02\"],[\"И-05\",\"Ошибка механизма, замятие коробки\",\"error_raised с кодом мотора или датчика\",\"Блокирующий\",\"По коду ошибки определить узел. Позвонить в ТТ: уточнить, как загружали коробки\",{\"visit\":\"p\",\"tt\":\"s\"},\"Механизм исправен, блокировка снята\"],[\"И-06\",\"Температура камеры вне нормы\",\"freezerTempC вне нормы, приостановка продаж\",\"Блокирующий\",\"Позвонить в ТТ: закрыты ли двери, состояние товара. Товар с нарушенным хранением утилизируется по правилам технолога\",{\"tt\":\"p\",\"visit\":\"s\"},\"Температура в норме, продажи возобновлены\"],[\"И-07\",\"Позиция без итога\",\"order_error с unconfirmed, order_expired\",\"Неблокирующий\",\"Позвонить в ТТ: проверить, выдана ли пицца. При невыдаче — возврат денег. Передать интегратору КШ\",{\"tt\":\"p\",\"ksh\":\"p\"},\"Итог подтвержден, возврат выполнен, причина записана\"],[\"И-08\",\"Невыдача после оплаты (обращение покупателя)\",\"Обращение ТТ или покупателя, нет события выдачи\",\"Неблокирующий\",\"Позвонить в ТТ: вернуть деньги через интерфейс администратора КСО. Передать интегратору КШ для расследования с Интегратором-Тилси\",{\"tt\":\"p\",\"ksh\":\"p\",\"tilpos\":\"s\"},\"Деньги возвращены, причина найдена\"],[\"И-09\",\"Проблема кассы\",\"Сообщение ТТ: POS-терминал, фискальный регистратор, зависание, интерфейс, СБП\",\"Блокирующий\",\"Позвонить в СП Тилпос\",{\"tilpos\":\"p\",\"tt\":\"s\"},\"КСО принимает оплату\"],[\"И-10\",\"КСО не видит аппарат\",\"Платформа: «health»: true, продаж нет, ошибки хаба\",\"Блокирующий\",\"Передать интегратору КШ: проверить /health и сеть точки. Позвонить в ТТ: проверить сетевой кабель\",{\"ksh\":\"p\",\"tt\":\"s\",\"tilpos\":\"s\"},\"Хаб получает /health, продажи идут\"],[\"И-11\",\"Пицца не забрана из окна выдачи\",\"Сообщение ТТ (события аппарата нет)\",\"Неблокирующий\",\"Позвонить в ТТ: извлечь пиццу\",{\"tt\":\"p\"},\"Окно выдачи свободно\"],[\"И-12\",\"Нет товара\",\"Все ячейки пусты\",\"Неблокирующий\",\"Позвонить в ТТ: пополнить и отметить ячейки\",{\"tt\":\"p\"},\"Остаток больше нуля в /v1/channels\"],[\"И-13\",\"Частые перезапуски приложения\",\"Короткие «health»: false, перезапуски, error_raised CrashGuard\",\"Неблокирующий\",\"Передать интегратору КШ\",{\"ksh\":\"p\"},\"Причина найдена, перезапуски прекратились\"],[\"И-14\",\"Сбой обновления агента\",\"Версия агента не изменилась, ошибка OTA\",\"Неблокирующий\",\"Передать интегратору КШ\",{\"ksh\":\"p\"},\"Аппарат на новой версии, /health «health»: true\"]],\"closing\":[\"Аппарат вернулся в M-02 и на платформе «health»: true, либо выезд назначен и записан в Яндекс Трекере.\",\"Блокировка печи снята только после подтверждения человеком на месте, что камера пуста.\",\"По каждой невыданной позиции деньги покупателю возвращены.\",\"В инциденте записаны причина, действия и кто их выполнил.\",\"Тех-бот опубликовал закрытие инцидента.\"],\"note\":\"Сроки реакции и закрытия по типам инцидентов не определены и требуют утверждения.\",\"rtk\":{\"name\":\"РТК «Робокафе»\",\"dev\":\"РТК «Робокафе»\",\"devSub\":\"события, телеметрия, звуковой вызов в зале\",\"platSub\":\"диспетчеризация · регистрирует инцидент\",\"intro\":[\"РТК сначала вызывает сотрудника магазина звуковым сообщением в торговом зале. Если событие не устранено за 10 мин, а истекший срок выдачи — за 30 мин, инцидент уходит дежурному. Без связи с диспетчеризацией РТК повторяет звуковое сообщение каждые 15 мин.\",\"Дальше процесс общий: платформа мониторинга регистрирует инцидент, дублирует его в Тех-бот и в Яндекс Трекер, дежурный выбирает направления эскалации и контролирует закрытие.\"],\"steps\":[\"РТК вызывает сотрудника магазина звуковым сообщением «Внимание, требуется помощь в кафетерии».\",\"Если событие не устранено за 10 мин (истекший срок выдачи — за 30 мин), или произошел критический отказ, или РТК не на связи, платформа мониторинга регистрирует инцидент: РТК, точку, режим, тип, время и номер заказа.\",\"Платформа дублирует инцидент в Тех-бот (группа Telegram или Max) и задачей в Яндекс Трекер руководителю сервиса.\",\"Дежурный принимает инцидент и определяет его тип по матрице.\",\"Дежурный эскалирует инцидент: СП Тилпос, инженер-интегратор КШ, сотрудник ТТ, выезд сервисного инженера. Удаленные команды выполняет только из белого списка (приложение Е.5 концепции РТК).\",\"Дежурный записывает в инциденте действия, ответы получателей и причину.\",\"Дежурный контролирует закрытие и закрывает инцидент. Тех-бот публикует закрытие.\"],\"routeWhat\":{\"ksh\":\"Разбор журналов РТК и первопричины, удаленное восстановление подсистем по белому списку, обновление ПО и технологических карт. При причине на стороне хаба привлекает Интегратора-Тилси\",\"tt\":\"Уточнение обстоятельств и дополнительные инструкции: уборка упавших предметов и проливов, утилизация брака, извлечение невостребованных заказов, ручное завершение позиции, пуск после остановки на месте, ежедневное обслуживание\",\"visit\":\"Внеплановое ТО после критического отказа, ручной возврат манипулятора на траекторию, ремонт сборки, снятие отметки «Критический отказ». Прибытие не позднее 4 ч после уведомления\"},\"incidents\":[[\"РИ-01\",\"РТК не на связи\",\"Нет телеметрии, статус «Нет связи»\",\"Неблокирующий\",\"Позвонить в ТТ: работает ли РТК, что на сервисной панели. Без связи РТК продолжает продавать и сам повторяет звуковой вызов\",{\"tt\":\"p\",\"ksh\":\"s\",\"visit\":\"s\"},\"Связь восстановлена, журнал за время без связи передан\"],[\"РИ-02\",\"Столкновение манипулятора\",\"Переход в M-06 по столкновению\",\"Блокирующий\",\"Позвонить в ТТ: осмотреть зону, при необходимости убрать (M-04.2), выполнить пуск на месте\",{\"tt\":\"p\",\"ksh\":\"s\"},\"РТК в M-03, прием открыт\"],[\"РИ-03\",\"Критический отказ\",\"Отметка «Критический отказ», M-05.2, отказ из перечня или повторное столкновение\",\"Блокирующий\",\"Назначить выезд. Не выставленные в ячейки позиции РТК отменил, возврат выполняет Контур. Передать интегратору КШ для разбора\",{\"visit\":\"p\",\"ksh\":\"s\",\"tt\":\"s\"},\"Инженер устранил отказ, снял отметку, провел тестовый цикл, РТК в M-03\"],[\"РИ-04\",\"Аварийный останов или открытие двери\",\"Переход в M-06 по функции безопасности\",\"Блокирующий\",\"Позвонить в ТТ: выяснить причину, убрать, выполнить сброс и пуск на месте. Если отклонение от траектории больше Δ — назначить выезд\",{\"tt\":\"p\",\"visit\":\"s\"},\"РТК в M-03\"],[\"РИ-05\",\"Требуется вмешательство персонала\",\"П2 = «Ожид
