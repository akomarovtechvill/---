cus-visible,.refblock summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}\n.attrs{display:grid;gap:6px;margin:0;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:13.5px}\n.attrs b{font-weight:600}\n.lgline{display:grid;grid-template-columns:34px 1fr;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted)}\n.lgline svg line{stroke:var(--fg);stroke-width:1.6}\n.lgline .cyc{stroke-width:3}\n.lgline .thin{stroke:var(--muted);stroke-width:1.4}\n.lgline .dash{stroke-dasharray:6 4}\n.lgline .dot{stroke-dasharray:1.5 3.5;stroke-linecap:round;stroke-width:2}\n.lgline .danger{stroke:var(--danger);stroke-dasharray:6 4}\n#legend:empty{display:none}\n\n#sm{min-width:900px}\n@media (min-width:1200px){#sm{min-width:0}}\n#sm .nid{font-size:12px}\n#sm .nname{font-size:15px}\n#sm .nstat{font-size:12px}\n#sm .ctitle{font-size:13.5px}\n#sm .badge text{font-size:11.5px}\n#sm.v-ov #g-dt{display:none}\n#sm.v-dt #g-ov{display:none}\n#sm:not(.l-safety) #g-flags{display:none}\n#sm.l-none .node.atom rect{fill:var(--surface);stroke:var(--fg);stroke-width:1.4}\n#sm.v-ov.l-none .node.sub rect{fill:transparent;stroke:var(--muted);stroke-dasharray:4 3;stroke-width:1.2}\n#sm.v-ov.l-none .node.sub text{fill:var(--muted)}\n#sm .ag path{fill:none;stroke-linejoin:round}\n#sm .ag path.halo{stroke:var(--surface);stroke-width:6}\n#sm .ag path.ln{stroke:var(--muted);stroke-width:1.4}\n#sm .ag.cycle path.ln{stroke:var(--fg);stroke-width:2.8}\n#sm .ag.safety path.ln{stroke:var(--danger);stroke-dasharray:6 4}\n#sm .ag.remote path.ln{stroke-dasharray:1.5 3.5;stroke-linecap:round;stroke-width:2}\n#sm .ag path.hit{stroke:transparent;stroke-width:16}\n#sm .ag{cursor:pointer;transition:opacity .15s}\n#sm .ag:focus{outline:none}\n#sm .ag:focus-visible path.ln{stroke-width:4}\n#sm .pill rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}\n#sm .pill text{font:600 11.5px var(--font-mono);fill:var(--muted);text-anchor:middle;dominant-baseline:central}\n#sm .mk-muted{fill:var(--muted)}\n#sm.has-sel .ag:not(.on){opacity:.15}\n#sm .ag.on path.ln{stroke-width:3.2}\n#sm.has-sel .tr.trail{opacity:.5}\n#sm.has-sel .node.trail{opacity:.65}\n@media (prefers-reduced-motion: reduce){#sm .ag{transition:none}}\n\n.refblock{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 18px}\n.refblock summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:16px}\n.refblock summary span{font-weight:400;font-size:13.5px;color:var(--muted);margin-left:8px}\n.refblock[open]{padding-bottom:18px}\n.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}\n.tabs button{font:500 13.5px var(--font-body);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--muted);cursor:pointer}\n.tabs button[aria-selected=\"true\"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}\n.tabp{display:grid;gap:10px;min-width:0}\n.pillsample{justify-self:start;font:600 11.5px var(--font-mono);color:var(--muted);border:1.2px solid var(--muted);border-radius:10px;padding:0 7px;line-height:18px}\n.rsec{display:grid;gap:10px;min-width:0}\n.rsec + .rsec{margin-top:10px}\n.rsec h3{margin:4px 0 0;font-size:16px;font-weight:700}\n.card p{margin:0;max-width:85ch}\n.dg{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:18px;background:var(--off-bg);color:var(--off);white-space:nowrap}\ntable.matrix{min-width:1220px}\ntd.dz{font-size:13px;min-width:150px}\n.side h4{margin:6px 0 0;font:500 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n\n.side .chips{gap:6px}\n.pnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}\n.pnav a,.pnav span{font:500 13px var(--font-body);padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;background:var(--surface)}\n.pnav span{background:var(--fg);color:var(--bg);border-color:var(--fg)}\n.pnav a:hover{background:var(--sel)}\n\n#sm .tr.lock path.ln{stroke:var(--danger);stroke-dasharray:6 4}\n#sm .tr.lock .badge circle{stroke:var(--danger)}\n#sm .node.comp rect{fill:var(--comp);stroke:var(--line)}\n#sm .node.comp.on rect{stroke:var(--muted)}\n#sm .junc{fill:var(--fg)}\n.scheme-only header,.scheme-only .controls,.scheme-only .side,.scheme-only .refblock,.scheme-only footer{display:none}\n.scheme-only .wrap{padding:0;max-width:none}\n.scheme-only .main{display:block}\n.scheme-only figure.diagram{border:0;border-radius:0}\n.scheme-only #sm{min-width:0}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div class=\"eyebrow\">IPLAYSMART · Концепция эксплуатации · модель режимов, черновик<\/div>\n    <h1>Режимы работы пиццемата<\/h1>\n    <p class=\"lead\">Модель для обсуждения. Нажмите на режим, чтобы раскрыть его переходы, на номер — чтобы увидеть условия перехода, или выберите сценарий и пройдите его по шагам.<\/p>  <\/header>\n\n  <div class=\"controls\">\n    <label class=\"ctl\" for=\"layer\">Слой\n      <select id=\"layer\">\n        <option value=\"none\">Без слоя<\/option>\n        <option value=\"hub\">Статус для хаба<\/option>\n        <option value=\"plat\">Статус платформы<\/option>\n        <option value=\"time\">Учет времени<\/option>\n        <option value=\"motion\">Механика и нагрев<\/option>\n      <\/select>\n    <\/label>\n    <label class=\"ctl\" for=\"scen\">Сценарий\n      <select id=\"scen\"><option value=\"\">Не выбран<\/option><\/select>\n    <\/label>\n    <div class=\"legend\" id=\"legend\"><\/div>\n  <\/div>\n\n  <div class=\"main\">\n    <figure class=\"diagram\" id=\"fig\">\n      <div class=\"scroll\">\n        <svg id=\"sm\" viewBox=\"0 0 1300 800\" role=\"group\" aria-label=\"Схема режимов пиццемата: режимы, подрежимы и переходы\"><\/svg>\n      <\/div>\n    <\/figure>\n    <aside class=\"side\" id=\"card\" aria-live=\"polite\"><\/aside>\n  <\/div>\n\n  <details class=\"refblock\" id=\"ref\">\n    <summary>Справочник модели<span>принципы, режимы, переходы, причины отказа, отказы, команды, заказ, параметры, решения, вопросы<\/span><\/summary>\n    <div class=\"tabs\" role=\"tablist\" aria-label=\"Разделы справочника\" id=\"tabs\"><\/div>\n    <div id=\"tabps\"><\/div>\n  <\/details>\n\n  <footer>Панель построена из той же модели, что и документ «IPS_ Концепция эксплуатации» (model/ips-model.js). Факты — по агенту 2.2.25, ЧТЗ v1.1, ICD-IPSM rev01 и документам изготовителя. Пометка «Требует обсуждения» означает предложение, не утвержденное владельцем продукта.<\/footer>\n<\/div>\n<script>\nconst M = {\"meta\":{\"title\":\"Концепция эксплуатации\",\"object\":\"вендинговый аппарат разогрева пиццы IPLAYSMART\",\"code\":\"ConOps-IPSM\",\"org\":\"ООО «Кибершеф». Москва, 2026\",\"rev\":\"00\",\"date\":\"03.11.2026\",\"status\":\"Черновик\",\"basis\":\"Агент шлюза 2.2.25 на обоих аппаратах, Android-приложение изготовителя 1.1.66\"},\"intro\":{\"background\":[\"Пиццемат IPLAYSMART (вендинговый аппарат разогрева пиццы 5-го поколения, изготовитель Guangzhou iPlaySmart Technology) продает замороженную пиццу, разогревает ее и выдает покупателю в окно выдачи. Аппарат работает в Контуре зоны кафетерия магазина «ВкусВилл»: заказ и оплата проходят на кассе самообслуживания (КСО) Контура, хаб интеграции передает аппарату оплаченный заказ.\",\"Аппарат — покупное готовое изделие. Штатное Android-приложение изготовителя (Aiwan, com.aiwan.automat) управляет платой готовки и связано с облаком изготовителя. Интегратор встроил в приложение шлюз (агент): локальный REST-интерфейс для хаба, локальный MQTT для подрядчика хаба и канал в систему мониторинга RB Monitoring. Механику, нагрев и холодильник аппарата интегратор не меняет.\",\"Документ описывает эксплуатацию аппарата в Контуре: режимы, роли, переходы, сценарии штатной и нештатной работы. Устройство шлюза и форматы обмена описаны в ICD-IPSM и ЧТЗ интеграции, документ ссылается на них и не повторяет их.\",\"Описано состояние на пилоте (две точки) и целевое решение. Отличия этапов приведены в приложении Г. Положения с пометкой «Требует обсуждения» — предложения, они не подтверждены владельцем продукта.\"],\"kpi\":[[\"Показатель\",\"Значение\"],[\"Пропускная способность\",\"Ограничена одной печью: пиццы готовятся по одной. Время цикла задает программа разогрева товара (по продукт-листу этапа 1 — 260 °C, 130 с) плюс перемещения. Целевое значение не определено\"],[\"Коэффициент эксплуатационной готовности\",\"Не определено. Измеряется по времени в M-02 с открытым приемом в часы работы точки (раздел 2.4, приложение Е.2)\"],[\"Доля заказов без итога\",\"Цель — ноль заказов в статусе «ожидание» дольше 15 мин. Обеспечено агентом с 2.2.20 (приложение Е.6)\"],[\"Время реакции на блокировку\",\"Не определено. Защелку печи снимает человек после осмотра (раздел 2.4)\"],[\"Конфигурация\",\"Единая для всех точек: одна сборка APK с агентом, один формат обмена с хабом\"]],\"assumptions\":[\"Аппарат стоит в торговом зале с поддерживаемым климатом. Изготовитель допускает установку внутри и снаружи помещения, без дождя и прямого солнца, с зазором не менее 30 см за задней стенкой для отвода тепла.\",\"Магазин дает электропитание 220 В с заземлением (номинальная мощность по руководству — 8,7 кВт), сетевое подключение (Ethernet или LTE-модем) и место для пополнения.\",\"Оплата и фискализация выполняются в Контуре на КСО. Хаб передает аппарату только оплаченные заказы. Возврат денег по невыданной позиции выполняет Контур по итогу, который сообщил аппарат.\",\"Пиццы поступают замороженными в коробках 12″ и хранятся в холодильной камере аппарата в ячейках, сгруппированных по видам. Пополняет и отмечает ячейки сотрудник магазина.\",\"Аппарат и КСО находятся в одном сегменте локальной сети точки. Хаб обращается к аппарату по LAN, без облака изготовителя.\",\"Мониторинг ведет диспетчер в RB Monitoring. Удаленный доступ инженера — через ADB-туннель через VPS интегратора.\",\"Ремонт механики, печи и холодильника выполняет сервисный инженер. Запасные части — по перечню изнашиваемых деталей изготовителя.\"],\"limits\":[\"Кнопки аварийного останова нет. Чтобы остановить аппарат немедленно, его обесточивают (акт приемки от 30.07.2026).\",\"Датчика «пицца в печи» нет. После невыданной позиции аппарат не знает, осталась ли пицца в камере, поэтому ставит защелку печи до осмотра человеком.\",\"Датчиков улицы, испарителя и влажности нет. Аппарат сообщает только температуру холодильной камеры и печи.\",\"Вход в сервисное меню защищен служебным кодом изготовителя. Персонал и инженер программно не различаются.\",\"Плата готовки управляется только через приложение изготовителя по последовательному порту. Интегратор не меняет прошивку платы и форматы JSON подрядчика хаба.\",\"Второй вход в облако изготовителя от имени аппарата запрещен: он вытесняет сессию аппарата.\"],\"modules\":[[\"Узел\",\"Назначение\"],[\"Холодильная камера\",\"Хранение замороженной пиццы в ячейках (на экране пополнения — 01…67), группы ячеек по видам пиццы. Режимы охлаждения или заморозки, оттаивание по таймеру, УФ-обеззараживание\"],[\"Тележка и лоток ячеек\",\"Извлекают коробку из ячейки и через дверцу холодильника подают ее в печь\"],[\"Печь\",\"Разогрев: нагревательные элементы, СВЧ или оба способа. Поддон с подъемом, вилка, поворотный стол. Программа разогрева задается на товар\"],[\"Окно выдачи\",\"Автоматическая дверь с фотоэлементом защиты от прищемления\"],[\"Компьютер аппарата\",\"Android 7.1.2 (rk3288), сенсорный экран, приложение изготовителя с агентом интегратора, Termux (локальный брокер MQTT, ADB-туннель)\"],[\"Плата готовки\",\"Управляет механикой и нагревом, отвечает на опрос статуса и сообщает температуры\"]],\"customer\":[\"Покупатель выбирает пиццу на КСО, оплачивает заказ (СБП, банковская карта, приложение ВкусВилл), получает чек и номер заказа.\",\"Хаб передает аппарату оплаченный заказ (POST /v1/vend). Аппарат принимает заказ и ставит позиции в очередь платы.\",\"Плата извлекает коробку из ячейки, разогревает пиццу и выдает ее в окно. На КСО покупатель видит «Заказ готов».\",\"Покупатель забирает пиццу из окна выдачи. Кнопка «Следующий заказ» на КСО освобождает кассу.\",\"Если позиция не выдана, аппарат сообщает итог «не выдан» с причиной. Возврат денег выполняет Контур.\"],\"externals\":[[\"Внешняя система\",\"Взаимодействие с аппаратом\"],[\"Хаб интеграции Контура (через КСО)\",\"Передает оплаченные заказы (REST :8787), получает перечень ячеек и остатки, итоги позиций, хартбит и ошибки (MQTT :1883). Интерфейс IF-27, документ ICD-IPSM\"],[\"RB Monitoring (диспетчеризация)\",\"Получает статус аппарата, температуры, фазы заказов и ошибки по MQTTS с клиентским сертификатом. Передает команды: опрос, остатки, перезагрузка, ADB-туннель, обновление агента\"],[\"Облако изготовителя Aiwan\",\"Учет заказов и ячеек изготовителя. Обмен ведет только приложение аппарата. Хаб и диспетчер к облаку не обращаются\"],[\"Репозиторий релизов агента\",\"Источник пакета обновления (OTA) агента\"],[\"VPS интегратора\",\"Обратный ADB-туннель для удаленной диагностики и установки\"],[\"Инженерная инфраструктура магазина\",\"Электропитание, сеть, размещение\"]]},\"needs\":[[\"Заинтересованная сторона\",\"Ожидание от аппарата\"],[\"Бизнес\",\"Продажа горячей пиццы без персонала у аппарата, предсказуемая выручка\"],[\"Покупатель\",\"Горячая пицца за несколько минут после оплаты. Если пицца не выдана — честный итог и возврат денег\"],[\"Сотрудник магазина\",\"Пополнение по понятной инструкции за несколько минут, без инженерной квалификации\"],[\"Диспетчер\",\"Видеть, доступен ли аппарат и почему нет, получать события о невыдаче и блокировках, восстанавливать работу удаленно, где это безопасно\"],[\"Подрядчик хаба\",\"Стабильный контракт REST и MQTT, однозначный итог каждой позиции\"],[\"Сервисный инженер\",\"Диагностика по журналам и дампам обмена с платой без выезда, ремонт механики на месте\"],[\"Интегратор (разработчик агента)\",\"Обновление агента удаленно, без потери настроек и сертификатов, с откатом через ADB\"]],\"functions\":[[\"Функция\",\"Что делает аппарат\"],[\"Прием заказов\",\"Принимает от хаба оплаченный заказ, проверяет готовность и остаток, ставит позиции в очередь платы. Отказывает с причиной (409, 503), если принять нельзя\"],[\"Хранение\",\"Держит пиццу в холодильной камере, ведет остатки ячеек по отметкам персонала, останавливает продажу при превышении температуры\"],[\"Приготовление и выдача\",\"Подает коробку в печь, разогревает по программе товара, выдает в окно\"],[\"Учет итога\",\"Ведет журнал заказов, сообщает итог каждой позиции: выдан, частично, не выдан, не подтвержден\"],[\"Защита от повторной готовки\",\"Ставит защелку печи после невыданной позиции, пока человек не проверит камеру\"],[\"Самовосстановление\",\"Перезапускает приложение, если плата не приняла задачу готовки, и передает дело инженеру при повторе\"],[\"Мониторинг\",\"Публикует хартбит, температуры, фазы заказов и ошибки на платформу и в локальный MQTT\"],[\"Удаленное обслуживание\",\"Выполняет команды платформы из белого списка, принимает обновление агента, открывает ADB-туннель\"]],\"roles\":[[\"Роль\",\"Что делает с аппаратом\"],[\"Покупатель\",\"Оплачивает заказ на КСО, забирает пиццу из окна выдачи\"],[\"Сотрудник магазина\",\"Пополняет ячейки и отмечает их в сервисном меню. По вызову диспетчера осматривает печь и окно выдачи, извлекает оставшуюся пиццу, сообщает «камера пуста». Не пользуется тестовым окном\"],[\"Диспетчер\",\"Следит за аппаратами в RB Monitoring, отдает удаленные команды, снимает защелку печи после подтверждения человека на месте, вызывает инженера\"],[\"Сервисный инженер\",\"ТО, ремонт и наладка на месте: тестовое окно, позиционирование ячеек, программы разогрева, устранение замятий\"],[\"Инженер-интегратор\",\"Выпускает агент, диагностирует по журналам и дампам удаленно, устанавливает APK\"],[\"Технолог\",\"Задает товар, время и температуру разогрева. С аппаратом напрямую не работает\"],[\"Изготовитель\",\"Гарантия и поддержка механики, печи, холодильника и приложения\"]],\"hmi\":[[\"Кто\",\"Средство\",\"Назначение\"],[\"Покупатель\",\"КСО Контура\",\"Выбор, оплата, номер заказа, «Заказ готов»\"],[\"Покупатель\",\"Окно выдачи\",\"Получение пиццы\"],[\"Покупатель\",\"Экран аппарата\",\"Состояние аппарата и выдачи. Продажа с экрана аппарата в Контуре не используется\"],[\"Сотрудник, инженер\",\"Ключ дверей аппарата\",\"Доступ к холодильной камере и узлам\"],[\"Сотрудник, инженер\",\"Сервисное меню (служебный код)\",\"Отметка ячеек, сброс ошибок, журнал отказов, пауза, перезапуск. Тестовое окно — только инженер\"],[\"Диспетчер\",\"RB Monitoring\",\"Статус, температуры, события, команды\"],[\"Инженер-интегратор\",\"ADB-туннель, локальный REST\",\"Журналы, дампы, снятие защелки, установка APK\"]],\"principles\":[\"Режим выделяется, если он отличается от соседних хотя бы одним из пяти признаков и это отличие можно проверить: прием заказов, механика и нагрев, кто внутри аппарата, статус для хаба, учет времени.\",\"Подрежим наследует свойства режима и добавляет свои. Подрежимы одного режима взаимоисключающие.\",\"Типовой день проходит так: M-02 → M-03.1 → M-02. Аппарат включен круглосуточно, потому что холодильная камера хранит товар. Работа вне часов точки требует обсуждения (В-01).\",\"Готовность к заказу определяется одним правилом Readiness: плата отвечала на опрос не более 30 с назад, статус платы не 7, защелки печи нет. То же значение получают хаб (/health, iplaysmart/status) и платформа.\",\"В RB Monitoring признак online означает живую сессию MQTTS, а не готовность. Готовность смотрят в /health. Два «онлайна» не смешивают.\",\"Защелка печи снимается только после того, как человек на месте подтвердил, что камера пуста. Перезапуск, перезагрузка и обновление защелку не снимают.\",\"Пока открыто сервисное меню, приложение закрывает порт платы. Сервисное меню и тестовое окно не открывают, пока в очереди есть заказ.\",\"Заказ не висит без итога: позиция без событий платы закрывается по таймауту с причиной (приложение Е.6).\",\"Агент не готовит пиццу сам. Готовка начинается только по оплаченному заказу хаба или по команде инженера в тестовом окне.\",\"Опасные удаленные команды выполняются только при пустой очереди и только из режима, указанного в приложении Е.5.\"],\"modes\":[{\"id\":\"OFF\",\"disp\":\"—\",\"name\":\"Выключен\",\"purpose\":\"Монтаж, перевозка, пропадание сети, остановка вместо аварийного останова\",\"accept\":\"Нет\",\"motion\":\"Обесточены. Холодильная камера не охлаждает\",\"person\":\"По процедуре\",\"hub\":\"Нет связи: соединение с :8787 отклонено или таймаут\",\"plat\":\"online:false по Will\",\"time\":\"В часы работы точки — организационный простой, иначе не учитывается\"},{\"id\":\"M-01\",\"disp\":\"M-01\",\"name\":\"Запуск\",\"purpose\":\"Загрузка Android, автозапуск брокера и туннеля, старт приложения и агента, выход на главный экран, возобновление опроса платы, прогрев печи\",\"accept\":\"Нет\",\"motion\":\"Самопроверка изготовителя, прогрев печи\",\"person\":\"Никого\",\"hub\":\"Нет связи, затем /health online:false\",\"plat\":\"online:false до сессии MQTTS\",\"time\":\"Как у режима, из которого выполнен вход\"},{\"id\":\"M-02\",\"disp\":\"M-02\",\"name\":\"Рабочий\",\"purpose\":\"Прием, разогрев и выдача пиццы\",\"accept\":\"Да, если нет причин П1\",\"motion\":\"Автоматически по заказу\",\"person\":\"Никого, двери закрыты\",\"hub\":\"/health online:true или 409 с причиной\",\"plat\":\"online:true, фазы заказов\",\"time\":\"Рабочее время, при причинах П1 — по причине\"},{\"id\":\"M-03\",\"disp\":\"M-03\",\"name\":\"Обслуживание персоналом\",\"purpose\":\"Работы сотрудника магазина через дверь и сервисное меню\"},{\"id\":\"M-03.1\",\"disp\":\"M-03.1\",\"name\":\"Пополнение\",\"purpose\":\"Загрузка коробок в ячейки, отметка ячеек и сохранение по видам, проверка сроков, уборка\",\"accept\":\"Нет\",\"motion\":\"Опрос платы прерван сервисным меню\",\"person\":\"Сотрудник магазина\",\"hub\":\"online:false через 30 с после закрытия порта\",\"plat\":\"online:true (сессия жива)\",\"time\":\"Плановый простой\"},{\"id\":\"M-03.2\",\"disp\":\"M-03.2\",\"name\":\"Вмешательство персонала\",\"purpose\":\"Осмотр печи и окна выдачи, извлечение оставшейся пиццы, сброс ошибок по указанию диспетчера\",\"accept\":\"Нет\",\"motion\":\"Опрос платы прерван сервисным меню\",\"person\":\"Сотрудник магазина\",\"hub\":\"online:false\",\"plat\":\"online:true\",\"time\":\"Внеплановый простой\"},{\"id\":\"M-04\",\"disp\":\"M-04\",\"name\":\"Инженерный\",\"purpose\":\"Работы сервисного инженера на месте\"},{\"id\":\"M-04.1\",\"disp\":\"M-04.1\",\"name\":\"Плановое ТО\",\"purpose\":\"ТО по регламенту изготовителя: чистка, проверка механики, печи, холодильника\",\"accept\":\"Нет\",\"motion\":\"Ручное управление из тестового окна\",\"person\":\"Сервисный инженер\",\"hub\":\"online:false\",\"plat\":\"online:true\",\"time\":\"Плановый простой\"},{\"id\":\"M-04.2\",\"disp\":\"M-04.2\",\"name\":\"Ремонт\",\"purpose\":\"Устранение отказа: замятие коробки, мотор, датчик, печь, холодильник\",\"accept\":\"Нет\",\"motion\":\"Ручное управление из тестового окна\",\"person\":\"Сервисный инженер\",\"hub\":\"online:false\",\"plat\":\"online:true\",\"time\":\"Внеплановый простой\"},{\"id\":\"M-04.3\",\"disp\":\"M-04.3\",\"name\":\"Наладка\",\"purpose\":\"Пусконаладка, позиционирование ячеек, программы разогрева, установка APK на месте, перемещение, вывод из эксплуатации\",\"accept\":\"Нет\",\"motion\":\"Ручное управление из тестового окна\",\"person\":\"Сервисный инженер, интегратор\",\"hub\":\"online:false\",\"plat\":\"online:true\",\"time\":\"Плановый простой\"},{\"id\":\"M-05\",\"disp\":\"M-05\",\"name\":\"Блокировка продаж\",\"purpose\":\"Аппарат включен, на главном экране, но заказы не принимает\"},{\"id\":\"M-05.1\",\"disp\":\"M-05.1\",\"name\":\"Приостановка\",\"purpose\":\"Статус платы 7 («использование приостановлено»), превышение температуры холодильной камеры, пауза из сервисного меню. Снимается автоматически или с экрана\",\"accept\":\"Нет, 409\",\"motion\":\"Готовка не начинается, охлаждение работает\",\"person\":\"Никого\",\"hub\":\"online:false, событие machine_blocked\",\"plat\":\"online:true, событие блокировки\",\"time\":\"Внеплановый простой, пауза — по причине\"},{\"id\":\"M-05.2\",\"disp\":\"M-05.2\",\"name\":\"Защелка\",\"purpose\":\"После невыданной позиции в камере может остаться пицца, либо плата повторно не принимает задачи готовки. Снимается только после проверки человеком\",\"accept\":\"Нет, 409\",\"motion\":\"Новая готовка запрещена\",\"person\":\"Никого до осмотра\",\"hub\":\"online:false, oven_blocked:true с причиной и заказом\",\"plat\":\"online:true, блокирующее событие\",\"time\":\"Внеплановый простой\"}],\"flags\":[{\"id\":\"ready\",\"name\":\"Готовность (Readiness)\",\"set\":\"Плата ответила на опрос не более 30 с назад, статус платы не 7, защелки нет\",\"clear\":\"Нарушено любое условие\",\"act\":\"Определяет online в /health и iplaysmart/status. /v1/vend при online:false отвечает 409\",\"t\":[2,6,9,12]},{\"id\":\"latch\",\"name\":\"Защелка печи\",\"set\":\"Позиция «не выдан» (пицца могла остаться в камере), повторный отказ платы в течение часа после перезапуска, процесс не перезапустился за 90 с\",\"clear\":\"POST /v1/oven/clear после подтверждения человека на месте, что камера пуста. Успешная выдача\",\"act\":\"Хранится в файле, переживает перезапуск и обновление. Запрещает новую готовку. Событие oven_blocked на платформу\",\"t\":[3,10,11,12]},{\"id\":\"restart\",\"name\":\"Перезапуск после отказа платы\",\"set\":\"Плата не подтвердила задачу готовки за 45 с (первый раз)\",\"clear\":\"Новый процесс приложения\",\"act\":\"/v1/vend отвечает 409 «повторите через минуту», очередь не отправляется, приложение перезапускается не чаще раза в час\",\"t\":[4]},{\"id\":\"plat\",\"name\":\"Сессия платформы\",\"set\":\"Установлена сессия MQTTS с RB Monitoring\",\"clear\":\"60 с без входящих пакетов, обрыв сети\",\"act\":\"Без сессии удаленные команды не доходят, события фаз заказа теряются (очереди платформы нет)\",\"t\":[]}],\"attrs02\":[[\"Признак\",\"Значения\",\"Правила\"],[\"П1 Прием\",\"Перечень активных причин отказа в приеме. Пустой перечень — прием открыт\",\"Причины и учет времени — в приложении Е.2. Причина снимается сама при устранении\"],[\"П2 Исполнение\",\"Простой (0), Готовит (1), Нужно подтверждение (2) — статус платы\",\"Пока плата не в простое или в очереди есть позиции, сервисное меню, тестовое окно, перезагрузку и обновление не выполняют\"],[\"П3 Состав меню\",\"Ячейки с остатком больше нуля и включенным каналом\",\"Остаток уменьшается при выдаче и задается отметкой ячеек или POST /v1/stock. Хаб опрашивает /v1/channels раз в 5 мин\"]],\"trans\":[{\"n\":1,\"from\":[\"OFF\"],\"to\":[\"M-01\"],\"fromL\":\"Выключен\",\"toL\":\"M-01\",\"kind\":\"human\",\"who\":\"Сотрудник или инженер на месте; автоматически при возврате сети\",\"cond\":\"Подано питание\",\"act\":\"Загрузка Android, автозапуск брокера MQTT и ADB-туннеля, запуск приложения и агента\"},{\"n\":2,\"from\":[\"M-01\"],\"to\":[\"M-02\"],\"fromL\":\"M-01\",\"toL\":\"M-02\",\"kind\":\"auto\",\"who\":\"Автоматически\",\"cond\":\"Главный экран продаж на переднем плане, плата отвечает на опрос, статус платы не 7, защелки нет\",\"act\":\"/health online:true, хартбит iplaysmart/status, статус на платформу\"},{\"n\":3,\"from\":[\"M-01\"],\"to\":[\"M-05\"],\"fromL\":\"M-01\",\"toL\":\"M-05\",\"kind\":\"lock\",\"who\":\"Автоматически\",\"cond\":\"При старте действует защелка печи из файла или плата сообщает статус 7\",\"act\":\"Отказ в приеме, /health oven_blocked:true или machine_blocked\"},{\"n\":4,\"from\":[\"M-02\",\"M-05\"],\"to\":[\"M-01\"],\"fromL\":\"M-02, M-05\",\"toL\":\"M-01\",\"kind\":\"remote\",\"who\":\"Автоматически: первый отказ платы принять задачу, падение процесса. Диспетчер удаленно: перезагрузка, обновление агента\",\"cond\":\"Для команд диспетчера — очередь пуста, П2 = «Простой». Авто-перезапуск — не чаще раза в час\",\"act\":\"Позиции, не начатые до перезапуска, закрываются че ановый простой. Без причин — рабочее время. Категории учета предложены по образцу РТК и требуют утверждения.\",\"failures\":{\"intro\":\"Отказ, требующий инженера, — состояние, которое сотрудник магазина и диспетчер не устраняют удаленно или без инструмента. К таким отказам относятся:\",\"items\":[\"замятие коробки (обычно при загрузке не язычком вперед) — аппарат стоит до приезда инженера,\",\"отказ мотора, концевика или датчика тележки, лотка, двери холодильника, печи или окна выдачи (событие error_raised с кодом платы),\",\"повторный отказ платы принять задачу готовки в течение часа после авто-перезапуска («нужен техник»),\",\"перегрев или недостаточный нагрев печи, задымление,\",\"холодильная камера не держит температуру, обледенение при выключенном оттаивании,\",\"отказ фотоэлемента окна выдачи (дверь не закрывается при ярком свете).\"],\"note\":\"Перечень составлен по руководству изготовителя и журналу инцидентов пилота. Классификацию «критический / существенный» требует утвердить владелец продукта (В-07).\"},\"rcols\":[\"M-01\",\"M-02\",\"M-03\",\"M-04\",\"M-05.1\",\"M-05.2\"],\"cmds\":[{\"cmd\":\"ping\",\"ch\":\"Платформа\",\"danger\":\"Нет\",\"cells\":{\"M-01\":[\"y\"],\"M-02\":[\"y\"],\"M-03\":[\"y\"],\"M-04\":[\"y\"],\"M-05.1\":[\"y\"],\"M-05.2\":[\"y\"]},\"note\":\"Ответ pong\"},{\"cmd\":\"stock / get_stock\",\"ch\":\"Платформа\",\"danger\":\"Нет\",\"cells\":{\"M-02\":[\"y\"],\"M-03\":[\"y\"],\"M-04\":[\"y\"],\"M-05.1\":[\"y\"],\"M-05.2\":[\"y\"]},\"note\":\"Снимок остатков\"},{\"cmd\":\"adb_tunnel, adb_restart\",\"ch\":\"Платформа\",\"danger\":\"Нет\",\"cells\":{\"M-01\":[\"y\"],\"M-02\":[\"y\"],\"M-03\":[\"y\"],\"M-04\":[\"y\"],\"M-05.1\":[\"y\"],\"M-05.2\":[\"y\"]},\"note\":\"Сторож туннеля в Termux, перезапуск adbd\"},{\"cmd\":\"reboot / reboot_android\",\"ch\":\"Платформа\",\"danger\":\"Да: прерывает готовку\",\"cells\":{\"M-02\":[\"c\",\"очередь пуста\"],\"M-05.1\":[\"y\"],\"M-05.2\":[\"c\",\"защелка сохраняется\"]},\"note\":\"Ведет в M-01 по T-04\"},{\"cmd\":\"ota / update\",\"ch\":\"Платформа\",\"danger\":\"Да: перезапуск приложения\",\"cells\":{\"M-02\":[\"c\",\"очередь пуста\"],\"M-05.1\":[\"y\"],\"M-05.2\":[\"y\"]},\"note\":\"Пакет агента, сертификаты и настройки не затираются. Ведет в M-01\"},{\"cmd\":\"unlock\",\"ch\":\"Платформа\",\"danger\":\"Нет\",\"cells\":{},\"note\":\"Замка нет, ответ ok:false\"},{\"cmd\":\"POST /v1/vend\",\"ch\":\"Хаб, LAN\",\"danger\":\"Да: запускает механику и нагрев\",\"cells\":{\"M-02\":[\"y\"]},\"note\":\"Только оплаченный заказ. 409 при online:false, 503 при незавершенной передаче\"},{\"cmd\":\"POST /v1/stock\",\"ch\":\"Хаб, LAN\",\"danger\":\"Нет\",\"cells\":{\"M-02\":[\"y\"],\"M-03\":[\"y\"],\"M-04\":[\"y\"],\"M-05.1\":[\"y\"],\"M-05.2\":[\"y\"]},\"note\":\"Абсолютный остаток. Не заменяет отметку ячеек при пополнении\"},{\"cmd\":\"POST /v1/oven/clear\",\"ch\":\"Интегратор, туннель\",\"danger\":\"Да: разрешает новую готовку\",\"cells\":{\"M-05.2\":[\"c\",\"после подтверждения на месте\"]},\"note\":\"Снимает защелку (T-12)\"},{\"cmd\":\"POST /v1/board/clear\",\"ch\":\"Интегратор, туннель\",\"danger\":\"Да: стирает очередь платы\",\"cells\":{\"M-04\":[\"y\"],\"M-05.2\":[\"c\",\"очередь проверена\"]},\"note\":\"Ручная очистка очереди\"},{\"cmd\":\"Второй вход в облако изготовителя\",\"ch\":\"—\",\"danger\":\"Запрещено\",\"cells\":{},\"note\":\"Вытесняет сессию аппарата\"}],\"cmdsNote\":[\"Опасная команда — та, после которой без действий человека начинаются движение механизмов или нагрев, либо прерывается начатая готовка, либо снимается защита от повторной готовки.\",\"Команды вне таблицы недопустимы. Возврат в работу из M-03 и M-04 выполняет только человек на месте.\",\"Команды платформы приходят по MQTTS с клиентским сертификатом аппарата. Задержка выполнения (delayMs) — не более 30 с.\",\"Снятие защелки через туннель — решение пилота. В целевом решении предлагается команда платформы oven_clear с обязательным полем «кто подтвердил на месте» (В-05).\"],\"orderStates\":[[\"Состояние позиции\",\"result_code / result\",\"Определение\"],[\"Принята\",\"1 / pending\",\"Заказ принят /v1/vend или кнопкой бесплатного заказа на экране, на платформу ушло order_accepted\"],[\"Готовится\",\"1 / pending, local_state 1\",\"Плата начала готовку штуки. В MQTT подрядчика не публикуется, на платформу — фаза dispensing\"],[\"Выдана\",\"2 / dispensed\",\"Плата сообщила об успехе, экран «заберите». Конечное\"],[\"Частично выдана\",\"3 / partial\",\"Выдана часть штук позиции. Конечное\"],[\"Не выдана\",\"4 / failed\",\"Ошибка платы, отказ до подтверждения, плата не приняла задачу, таймаут. Причина в result_text. Конечное\"],[\"Не подтверждена\",\"4 / failed, unconfirmed:true\",\"Готовка начиналась, итог не пришел. Нужна ручная проверка выдачи. Конечное\"]],\"orderTrans\":[[\"№\",\"Из\",\"В\",\"Событие\"],[\"З-01\",\"—\",\"Принята\",\"POST /v1/vend 200, событие iplaysmart/order, order_accepted на платформу\"],[\"З-02\",\"Принята\",\"Готовится\",\"Плата начала готовку (onMaking)\"],[\"З-03\",\"Готовится\",\"Выдана\",\"board_ready, local_state 2\"],[\"З-04\",\"Готовится\",\"Не выдана\",\"board_failed, local_state 3. Ставится защелка печи (T-10)\"],[\"З-05\",\"Принята\",\"Не выдана\",\"shipment_failed (отказ до подтверждения) или board_no_ack (45 с без подтверждения). Пиццы нет\"],[\"З-06\",\"Принята\",\"Не выдана\",\"Через 60 с после старта процесса: «автомат перезапускался до начала готовки»\"],[\"З-07\",\"Принята\",\"Не выдана\",\"15 мин без событий и не в очереди платы: «плата не начала готовку»\"],[\"З-08\",\"Готовится\",\"Не подтверждена\",\"15 мин без итога: «результат не подтвержден — проверьте выдачу», order_expired\"],[\"З-09\",\"Готовится\",\"Частично выдана\",\"Часть штук выдана, остальные закрыты по З-04…З-08\"]],\"orderNotes\":[\"Конечный статус не меняется: поздний итог от платы после закрытия отбрасывается.\",\"События order_expired и order_error уходят один раз и только для заказов не старше 24 ч. Более старые закрываются без событий.\",\"Хаб считает ответ /v1/vend принятием заказа, а не выдачей. Источник истины по позиции — iplaysmart/order/item, резерв — GET /v1/orders/{id}.\",\"Повторная передача того же заказа хабом опирается на client_order_id и GET /v1/jobs/{client_order_id}. Второй /v1/vend при зависшем первом сразу получает 503 — двойной пиццы нет.\"],\"params\":[[\"Параметр\",\"Значение\"],[\"Порог живости платы\",\"30 с с последнего ответа на опрос\"],[\"Хартбит iplaysmart/status и device_status\",\"30 с\"],[\"Признак падения приложения для хаба\",\"Нет хартбита 60–90 с и нет ответа /health\"],[\"Ожидание подтверждения задачи платой\",\"45 с, повторы кадра через 5 с, до 3 раз\"],[\"Авто-перезапуск приложения\",\"Не чаще раза в час, проверка через 90 с\"],[\"Закрытие позиции без событий\",\"15 мин; не начатые до перезапуска — 60 с после старта\"],[\"Срок отправки событий о закрытии\",\"Заказы не старше 24 ч\"],[\"Ответ /v1/vend\",\"До 30 с (передача в очередь 15 + 15 с)\"],[\"Таймаут хаба на REST по ICD-IPSM\",\"20 с — меньше максимального ответа /v1/vend, требует согласования (В-04)\"],[\"Опрос /v1/channels хабом\",\"5 мин\"],[\"Сессия платформы\",\"keepalive 45 с, связь мертва после 60 с без входящих, переподключение через 3 с\"],[\"Оповещение «аппарат недоступен»\",\"online:false дольше 2 мин\"],[\"Программа разогрева\",\"На товар. Продукт-лист этапа 1: 260 °C, 130 с\"],[\"Порог отключения по температуре камеры, время восстановления\",\"Настройка изготовителя, значения не утверждены (В-06)\"],[\"Оттаивание\",\"Рекомендация изготовителя — каждые 15 мин при температуре ниже −10 °C\"],[\"Дамп обмена с платой\",\"Кольцо 3 мин или 3000 кадров, хранится 30 файлов\"],[\"Очередь публикаций агента\",\"200 сообщений\"]],\"scen\":[{\"id\":\"OS-101\",\"grp\":\"norm\",\"name\":\"Ввод в работу после включения\",\"start\":\"Аппарат выключен, ячейки загружены.\",\"steps\":[[\"Сотрудник или инженер включает питание.\",\"T-1\"],[\"Android загружается, автозапуск поднимает брокер MQTT и ADB-туннель, стартует приложение и агент.\",\"M-01\"],[\"Приложение выходит на главный экран продаж, плата отвечает на опрос, печь прогревается.\",\"M-01\"],[\"Если защелки нет и статус платы не 7, аппарат переходит в M-02: /health online:true, хартбит в iplaysmart/status, статус на платформу.\",\"T-2\"],[\"Если при старте действует защелка, аппарат остается заблокированным (OS-201).\",\"T-3\"]],\"result\":\"Аппарат принимает заказы.\"},{\"id\":\"OS-102\",\"grp\":\"norm\",\"name\":\"Покупка пиццы\",\"start\":\"M-02, прием открыт, в ячейке есть пицца.\",\"steps\":[[\"Покупатель выбирает пиццу на КСО и оплачивает.\",\"M-02\"],[\"Хаб передает заказ POST /v1/vend с client_order_id. Аппарат отвечает 200, все позиции «ожидание». В iplaysmart/order уходит тот же снимок, на платформу — order_accepted.\",\"M-02\"],[\"Плата извлекает коробку, разогревает пиццу по программе товара и выдает в окно.\",\"M-02\"],[\"Аппарат публикует board_ready в iplaysmart/order/item. Хаб показывает на КСО «Заказ готов».\",\"M-02\"],[\"Покупатель забирает пиццу из окна выдачи.\",\"M-02\"]],\"result\":\"Позиция выдана, остаток ячейки уменьшен.\"},{\"id\":\"OS-103\",\"grp\":\"norm\",\"name\":\"Заказ из нескольких пицц\",\"start\":\"M-02, в заказе несколько позиций.\",\"steps\":[[\"Хаб передает один /v1/vend с несколькими позициями.\",\"M-02\"],[\"Печь одна, поэтому плата готовит пиццы по очереди. Итог по каждой позиции приходит отдельным событием.\",\"M-02\"],[\"Если одна позиция не выдана, остальные продолжаются. Хаб показывает частичное исполнение, Контур возвращает деньги за невыданную.\",\"M-02\"]],\"result\":\"Каждая позиция имеет конечный итог.\",\"discuss\":\"Порядок выдачи нескольких пицц из одного окна и сообщение покупателю — требует обсуждения с бизнесом.\"},{\"id\":\"OS-104\",\"grp\":\"norm\",\"name\":\"Пополнение\",\"start\":\"M-02, мало остатка или плановое время пополнения.\",\"steps\":[[\"Сотрудник убеждается, что аппарат не готовит и очереди нет.\",\"M-02\"],[\"Сотрудник открывает дверь ключом и входит в сервисное меню. Аппарат перестает принимать заказы.\",\"T-5\"],[\"Сотрудник кладет коробки язычком вперед в ячейки своего вида, отмечает ячейки и нажимает «Сохранить» под каждым видом.\",\"M-03.1\"],[\"Сотрудник выходит из меню и закрывает двери.\",\"T-6\"],[\"Аппарат возобновляет опрос платы и прием. Хаб видит новые остатки в /v1/channels не позже чем через 5 мин.\",\"M-02\"]],\"result\":\"Ячейки пополнены и отмечены, аппарат в работе.\"},{\"id\":\"OS-105\",\"grp\":\"norm\",\"name\":\"Плановое ТО\",\"start\":\"Наступил срок ТО по регламенту изготовителя.\",\"steps\":[[\"Инженер дожидается пустой очереди и входит в сервисное меню.\",\"T-14\"],[\"Инженер выполняет работы, при необходимости управляет узлами из тестового окна.\",\"M-04.1\"],[\"После замены узла или позиционирования инженер проводит тестовый цикл.\",\"M-04.1\"],[\"Инженер выходит из меню.\",\"T-16\"]],\"result\":\"ТО выполнено, аппарат в работе.\"},{\"id\":\"OS-106\",\"grp\":\"norm\",\"name\":\"Обновление агента\",\"start\":\"Выпущена новая версия агента.\",\"steps\":[[\"Интегратор выпускает пакет: версия, APK, архив обновления в репозитории релизов.\",\"M-02\"],[\"Диспетчер убеждается, что очередь пуста, и отдает команду ota.\",\"M-02\"],[\"Аппарат скачивает пакет с докачкой, устанавливает APK и перезапускает приложение. Сертификаты и настройки не затираются.\",\"T-4\"],[\"Аппарат проходит запуск и возвращается в M-02. Диспетчер видит новую версию в статусе, интегратор проверяет /health.\",\"T-2\"],[\"Если обновление сорвалось, интегратор ставит APK через ADB-туннель.\",\"M-04.3\"]],\"result\":\"Аппарат работает на новой версии агента.\"},{\"id\":\"OS-201\",\"grp\":\"fail\",\"name\":\"Пицца не выдана: защелка печи\",\"start\":\"M-02, плата вернула ошибку по позиции.\",\"steps\":[[\"Позиция закрывается «не выдан» (board_failed). Пицца могла остаться в камере, датчика нет.\",\"M-02\"],[\"Аппарат ставит защелку печи и перестает принимать заказы. На платформу уходит oven_blocked.\",\"T-10\"],[\"Диспетчер вызывает сотрудника или инженера к аппарату.\",\"M-05.2\"],[\"Человек на месте открывает аппарат, осматривает печь и окно, извлекает пиццу.\",\"T-11\"],[\"Человек подтверждает «камера пуста». Диспетчер или интегратор снимает защелку.\",\"T-12\"]],\"result\":\"Камера пуста, прием возобновлен, Контур вернул деньги за позицию.\"},{\"id\":\"OS-202\",\"grp\":\"fail\",\"name\":\"Плата не приняла задачу готовки\",\"start\":\"M-02, задача готовки отправлена, плата отвечает на опрос, но не подтверждает задачу.\",\"steps\":[[\"Агент повторяет кадр до 3 раз через 5 с. Через 45 с без подтверждения позиция закрывается «не выдан», пиццы нет (board_no_ack).\",\"M-02\"],[\"Аппарат перестает принимать заказы и перезапускает приложение. Дамп обмена с платой сохраняется для разбора.\",\"T-4\"],[\"Новый процесс проходит запуск и принимает заказы.\",\"T-2\"],[\"Если отказ повторился в течение часа, ставится защелка «нужен техник», диспетчер вызывает инженера.\",\"T-10\"],[\"Инженер устраняет причину, защелку снимают.\",\"T-12\"]],\"result\":\"Аппарат восстановлен перезапуском или ждет инженера.\"},{\"id\":\"OS-203\",\"grp\":\"fail\",\"name\":\"Заказ без итога\",\"start\":\"M-02, по позиции нет событий от платы.\",\"steps\":[[\"Если позиция не начата и аппарат перезапускался, через 60 с после старта она закрывается «автомат перезапускался до начала готовки».\",\"M-02\"],[\"Если позиция не начата и не стоит в очереди платы 15 мин — «плата не начала готовку».\",\"M-02\"],[\"Если готовка началась, но итог не пришел 15 мин, позиция закрывается как неподтвержденная, на платформу уходит order_error с unconfirmed.\",\"M-02\"],[\"Хаб передает итог, Контур возвращает деньги. Неподтвержденную позицию проверяют вручную.\",\"M-02\"]],\"result\":\"У каждой позиции есть конечный итог.\",\"discuss\":\"Ставить ли защелку при неподтвержденной позиции — В-08.\"},{\"id\":\"OS-204\",\"grp\":\"fail\",\"name\":\"Блокировка платы (статус 7)\",\"start\":\"M-02, плата сообщила «использование приостановлено».\",\"steps\":[[\"Аппарат публикует machine_blocked, /v1/vend отвечает 409.\",\"T-8\"],[\"Агент сбрасывает статус 7 автоматически. Если не вышло, сотрудник по указанию диспетчера сбрасывает ошибки в сервисном меню.\",\"M-05.1\"],[\"После снятия статуса аппарат публикует machine_unblocked и принимает заказы.\",\"T-9\"]],\"result\":\"Аппарат в работе.\"},{\"id\":\"OS-205\",\"grp\":\"fail\",\"name\":\"Ошибка механизма, замятие коробки\",\"start\":\"M-02, плата сообщила код ошибки мотора или датчика.\",\"steps\":[[\"Аппарат публикует error_raised с кодом и текстом ошибки. Позиция закрывается «не выдан», ставится защелка.\",\"T-10\"],[\"Диспетчер по коду определяет, нужен ли инженер, и вызывает его.\",\"M-05.2\"],[\"Инженер в сервисном меню устраняет замятие или меняет узел, проверяет узел в тестовом окне.\",\"T-13\"],[\"Инженер снимает защелку и выходит из меню.\",\"T-16\"]],\"result\":\"Механизм исправен, аппарат в работе.\"},{\"id\":\"OS-206\",\"grp\":\"fail\",\"name\":\"Нарушение температуры камеры\",\"start\":\"M-02, температура холодильной камеры выше порога отключения.\",\"steps\":[[\"Аппарат останавливает продажу по функции изготовителя. Температура видна на платформе (freezerTempC).\",\"T-8\"],[\"Если температура вернулась за время восстановления, продажа возобновляется.\",\"T-9\"],[\"Если нет, диспетчер вызывает инженера. Товар с нарушенным хранением сотрудник утилизирует по правилам технолога.\",\"T-13\"]],\"result\":\"Товар хранится при заданной температуре.\",\"discuss\":\"Порог, время восстановления и правило утилизации — В-06.\"},{\"id\":\"OS-207\",\"grp\":\"fail\",\"name\":\"Пропадание сети\",\"start\":\"Любой режим, пропала сеть 220 В.\",\"steps\":[[\"Аппарат обесточен: печь, механика и холодильник остановлены. ИБП нет.\",\"T-18\"],[\"Очередь платы в памяти теряется. Платформа получает online:false по Will.\",\"OFF\"],[\"При возврате сети аппарат включается сам.\",\"T-1\"],[\"Позиции, не начатые до пропадания, закрываются через 60 с после старта. Начатые — через 15 мин как неподтвержденные.\",\"M-01\"],[\"Аппарат возвращается в M-02 или, если действует защелка, в M-05.2.\",\"T-2\"]],\"result\":\"Аппарат в работе, итоги прерванных позиций переданы.\",\"discuss\":\"Проверка камеры после пропадания сети во время готовки — В-08.\"},{\"id\":\"OS-208\",\"grp\":\"fail\",\"name\":\"Нет связи хаба с аппаратом\",\"start\":\"M-02, хаб не получает ответ от :8787 и хартбит.\",\"steps\":[[\"Хаб считает аппарат недоступным: нет ответа /health и нет хартбита 60–90 с. Пиццы на КСО не продаются.\",\"M-02\"],[\"Если платформа видит аппарат online, причина в локальной сети или КСО. Если нет — в аппарате или его подключении.\",\"M-02\"],[\"После восстановления хаб сверяет заказы по GET /v1/orders/{id} и /v1/jobs/{client_order_id}.\",\"M-02\"]],\"result\":\"Связь восстановлена, итоги заказов сверены.\"},{\"id\":\"OS-209\",\"grp\":\"fail\",\"name\":\"Нет связи с платформой\",\"start\":\"M-02, сессия MQTTS разорвана, хаб доступен.\",\"steps\":[[\"Аппарат продолжает продавать. Команды платформы и обновления не доходят.\",\"M-02\"],[\"Платформа показывает online:false. Оповещение — если это длится дольше 2 мин.\",\"M-02\"],[\"Агент переподключается каждые 3 с. События фаз заказа за время обрыва теряются (очереди нет).\",\"M-02\"]],\"result\":\"Продажи не прерывались, статус на платформе восстановлен.\"},{\"id\":\"OS-210\",\"grp\":\"fail\",\"name\":\"Сервисное меню открыто во время готовки\",\"start\":\"M-02, плата готовит, сотрудник открыл сервисное меню или тестовое окно.\",\"steps\":[[\"Приложение закрывает и открывает порт платы. Итог текущей позиции может потеряться.\",\"T-5\"],[\"Позиция закрывается по таймауту как неподтвержденная или «не выдан» с защелкой.\",\"M-03.1\"],[\"Диспетчер проверяет выдачу и, при защелке, ведет по OS-201.\",\"M-05.2\"]],\"result\":\"Итог позиции известен, камера проверена.\",\"discuss\":\"Агент не запрещает открыть меню во время готовки. Нужен запрет или предупреждение на экране — В-09.\"},{\"id\":\"OS-211\",\"grp\":\"fail\",\"name\":\"Пицца не забрана из окна выдачи\",\"start\":\"M-02, позиция выдана, покупатель не забрал пиццу.\",\"steps\":[[\"Поведение аппарата при незабранной пицце и при следующем заказе не описано изготовителем.\",\"M-02\"],[\"Предлагается: диспетчер по событию вызывает сотрудника, сотрудник извлекает пиццу по T-07.\",\"T-7\"]],\"result\":\"Окно выдачи свободно.\",\"discuss\":\"Требует обсуждения: таймаут, сообщение покупателю, судьба пиццы (В-03).\"}],\"escalation\":[\"Звукового вызова сотрудника у аппарата нет. Все события идут диспетчеру через RB Monitoring и подрядчику хаба через iplaysmart/error.\",\"Блокирующие события: oven_blocked, board_no_ack с блокировкой, machine_blocked, отсутствие online дольше 2 мин. Диспетчер вызывает сотрудника магазина или инженера по матрице эскалации (приложение Д).\",\"Неблокирующие события: error_raised без блокировки, order_expired, unconfirmed. Диспетчер разбирает их в рабочем порядке.\"],\"physical\":[\"Аппарат устанавливается в торговом зале на ровном полу, с зазором не менее 30 см за задней стенкой.\",\"Питание 220 В с заземлением, номинальная мощность 8,7 кВт по руководству изготовителя. Есть электрическая схема трехфазного исполнения — исполнение для точек уточнить (В-10).\",\"Сеть: Ethernet в сегмент точки (для хаба) и выход в интернет (для платформы). Wi-Fi аппарата — только 2,4 ГГц.\",\"Рядом с аппаратом нужно место для коробок при пополнении. Дверь открывается ключом.\"],\"support\":[\"Первая линия — диспетчер: статус, события, перезагрузка, туннель, обновление агента.\",\"Вторая линия — интегратор: журналы ipsm_api, ipsm_platform, ipsm_orders, дампы обмена с платой, снятие защелки, установка APK.\",\"Третья линия — сервисный инженер на месте: механика, печь, холодильник. Время прибытия не определено.\",\"Изготовитель: гарантия, запасные части по перечню изнашиваемых деталей, консультации по механике.\",\"Релизы агента ведутся в репозитории ips-agent. Сборку и установку APK выполняет интегратор только по запросу и при пустой очереди.\"],\"risks\":[[\"№\",\"Риск\",\"Мера\"],[\"Р-01\",\"Обновление приложения изготовителем удалит агент\",\"Обновления изготовителя ставит только интегратор, после проверки на стенде (эмулятор контракта и аппарат лаборатории)\"],[\"Р-02\",\"Служебный код сервисного меню одинаков у всех аппаратов и напечатан в инструкции\",\"Ограничить распространение инструкции, включить пароль настроек изготовителя, рассмотреть разделение кодов персонала и инженера (В-02)\"],[\"Р-03\",\"Общий ключ REST и пароль MQTT для всех аппаратов\",\"Хранить в хранилище секретов, не публиковать в документах, ограничить доступ к сегменту сети\"],[\"Р-04\",\"Нет кнопки аварийного останова\",\"Оценка рисков, доступность автомата питания для сотрудника (В-11)\"],[\"Р-05\",\"Нет датчика пиццы в печи\",\"Защелка печи с проверкой человеком (решение 2)\"],[\"Р-06\",\"Таймаут хаба 20 с меньше ответа /v1/vend до 30 с — хаб повторит заказ, который аппарат уже принял\",\"Согласовать таймаут 35 с и обязательное использование client_order_id (В-04)\"],[\"Р-07\",\"QoS 0 в локальном MQTT, нет очереди событий платформы\",\"Сверка GET /v1/orders/{id}, персистентная очередь платформы в плане агента\"],[\"Р-08\",\"Повторное создание экрана продаж плодит циклы опроса и отправки вендора\",\"VendorGuard с 2.2.25, контроль vendor_shipment_loops = 1 в /health\"],[\"Р-09\",\"Загрузка коробки не той стороной вызывает замятие и простой до инженера\",\"Инструкция пополнения «язычком вперед», обучение сотрудников\"]],\"decisions\":[[\"№\",\"Решение\",\"Обоснование\"],[\"1\",\"Заказ хаба выполняется локально в приложении аппарата, без облачной удаленной выдачи изготовителя как основного пути\",\"Независимость от облака изготовителя, предсказуемое время приема\"],[\"2\",\"После невыданной позиции ставится защелка печи. Снимается только после подтверждения человеком на месте, что камера пуста. Переживает перезапуск и обновление\",\"Датчика пиццы в печи нет, вторая готовка при пицце в камере опасна\"],[\"3\",\"Первый отказ платы принять задачу — заказ «не выдан» и авто-перезапуск приложения не чаще раза в час. Повтор в течение часа — защелка «нужен техник»\",\"Перезапуск лечит переполнение очереди отправки, систематический отказ требует инженера\"],[\"4\",\"Позиция без итога закрывается по таймауту: 60 с после старта для не начатых до перезапуска, 15 мин для остальных. Начатые без итога — «не подтверждена»\",\"Покупатель и Контур получают итог, возврат не зависает\"],[\"5\",\"Готовность определяется одним правилом Readiness и одинаково отдается хабу и платформе\",\"Один ответ на вопрос «можно ли продать сейчас»\"],[\"6\",\"online платформы — сессия MQTTS, online хаба — готовность. Их не смешивают. Оповещение о недоступности — после 2 мин online:false\",\"Короткие online:false при перезапусках — норма\"],[\"7\",\"При online:false /v1/vend отвечает 409, второй /v1/vend при незавершенном первом — 503\",\"Нет приема заказов, которые аппарат не выполнит, нет двойной пиццы\"],[\"8\",\"Формат JSON подрядчика хаба не меняется, новые поля только добавляются\",\"Совместимость с хабом и КСО\"],[\"9\",\"Обновление агента — удаленно пакетом, только при пустой очереди. Сертификаты и локальные настройки обновлением не затираются\",\"Обновление без выезда, без потери связи с платформой\"],[\"10\",\"Агент не выдумывает датчики: на платформу идут только температуры камеры и печи\",\"Достоверность мониторинга\"],[\"11\",\"Режимы аппарата: Выключен, M-01 Запуск, M-02 Рабочий, M-03 Обслуживание персоналом (M-03.1, M-03.2), M-04 Инженерный (M-04.1, M-04.2, M-04.3), M-05 Блокировка продаж (M-05.1, M-05.2)\",\"Режимы различаются пятью признаками раздела 2.4. Требует утверждения\"],[\"12\",\"Диагностика и установка APK — через ADB-туннель, поднимаемый командой платформы\",\"Аппарат за NAT, локальная сеть точки с офиса не маршрутизируется\"]],\"esc\":{\"intro\":[\"Инциденты собираются в платформе мониторинга RB Monitoring и эскалируются диспетчеру-дежурному сервисному инженеру (далее — дежурный). Каждый инцидент дублируется в Тех-бот — группу в Telegram или Max — и задачей в Яндекс Трекер руководителю сервиса.\",\"Дежурный определяет тип инцидента по матрице Д.3, выбирает одно или несколько направлений эскалации и контролирует закрытие инцидента.\"],\"steps\":[\"Аппарат публикует событие или перестает выходить на связь. Платформа мониторинга регистрирует инцидент: аппарат, точку, тип, время и номер заказа, если он есть. Пропадание связи регистрируется, если «health»: false держится дольше 2 мин.\",\"Платформа дублирует инцидент в Тех-бот (группа Telegram или Max) и задачей в Яндекс Трекер руководителю сервиса.\",\"Дежурный принимает инцидент и определяет его тип по матрице Д.3.\",\"Дежурный эскалирует инцидент по одному или нескольким направлениям: СП Тилпос, инженер-интегратор КШ, сотрудник ТТ, выезд сервисного инженера.\",\"Дежурный записывает в инциденте действия, ответы получателей и причину.\",\"Дежурный контролирует закрытие по критериям Д.4 и закрывает инцидент. Тех-бот публикует закрытие.\"],\"sources\":[{\"id\":\"dev\",\"name\":\"Аппарат IPLAYSMART\",\"sub\":\"события, температуры, «health»\"},{\"id\":\"plat\",\"name\":\"Платформа мониторинга\",\"sub\":\"RB Monitoring · регистрирует инцидент\"},{\"id\":\"bot\",\"name\":\"Тех-бот\",\"sub\":\"группа Telegram или Max\"},{\"id\":\"yt\",\"name\":\"Руководитель сервиса\",\"sub\":\"задача в Яндекс Трекере\"},{\"id\":\"duty\",\"name\":\"Диспетчер-дежурный сервисный инженер\",\"sub\":\"принимает решение, контролирует закрытие\"},{\"id\":\"close\",\"name\":\"Закрытие инцидента\",\"sub\":\"критерии Д.4\"}],\"routes\":[{\"id\":\"tilpos\",\"name\":\"СП Тилпос\",\"sub\":\"звонок\",\"ch\":\"Звонок\",\"what\":\"Проблемы касс: POS-терминал, фискальный регистратор, зависание, интерфейс КСО, СБП и другие платежи\",\"give\":\"Точка, номер КСО, время, номер чека или заказа, что видит сотрудник\"},{\"id\":\"ksh\",\"name\":\"Инженер-интегратор КШ\",\"sub\":\"Тех-бот, звонок\",\"ch\":\"Тех-бот, звонок\",\"what\":\"Диагностика по журналам и дампам обмена с платой, анализ первопричины, снятие блокировки на пилоте, обновление агента. При причине на стороне хаба привлекает Интегратора-Тилси\",\"give\":\"Аппарат, время, номер заказа, событие платформы\"},{\"id\":\"tt\",\"name\":\"Сотрудник ТТ\",\"sub\":\"звонок\",\"ch\":\"Звонок\",\"what\":\"Уточнение обстоятельств и дополнительные инструкции: осмотр печи и окна выдачи, извлечение пиццы, сброс ошибок, пополнение, возврат денег покупателю через интерфейс администратора КСО\",\"give\":\"Что проверить и что сделать, кому сообщить результат\"},{\"id\":\"visit\",\"name\":\"Сервисный инженер\",\"sub\":\"выезд или назначение\",\"ch\":\"Выезд дежурного или назначение через руководителя сервиса\",\"what\":\"Ремонт механики, печи, холодильной камеры, устранение замятия, повторная блокировка «нужен техник»\",\"give\":\"Аппарат, точка, код ошибки, что уже сделано на месте\"}],\"second\":[{\"id\":\"tilsi\",\"name\":\"Интегратор-Тилси\",\"sub\":\"второй уровень\",\"from\":\"ksh\",\"what\":\"Расследование невыдачи после оплаты и сбоев связи хаба с аппаратом\"}],\"incidents\":[[\"И-01\",\"Аппарат недоступен\",\"«health»: false дольше 2 мин, нет хартбита\",\"Блокирующий\",\"Проверить, нет ли обрыва связи у нескольких аппаратов. Позвонить в ТТ: есть ли питание, что на экране аппарата\",{\"tt\":\"p\",\"ksh\":\"s\",\"visit\":\"s\"},\"Аппарат на связи, /health «health»: true\"],[\"И-02\",\"Пицца не выдана, блокировка печи\",\"oven_blocked, позиция «не выдан»\",\"Блокирующий\",\"Позвонить в ТТ: осмотреть печь и окно выдачи, извлечь пиццу, подтвердить «камера пуста», вернуть деньги покупателю\",{\"tt\":\"p\",\"ksh\":\"s\",\"visit\":\"s\"},\"Блокировка снята после подтверждения на месте, деньги возвращены\"],[\"И-03\",\"Плата не принимает задачи, «нужен техник»\",\"board_no_ack с блокировкой\",\"Блокирующий\",\"Передать инцидент интегратору КШ для анализа дампа, назначить выезд\",{\"ksh\":\"p\",\"visit\":\"p\",\"tt\":\"s\"},\"Причина устранена, блокировка снята, аппарат в M-02\"],[\"И-04\",\"Блокировка платы не снялась\",\"machine_blocked без machine_unblocked\",\"Блокирующий\",\"Позвонить в ТТ: сбросить ошибки в сервисном меню по инструкции\",{\"tt\":\"p\",\"ksh\":\"s\",\"visit\":\"s\"},\"machine_unblocked, аппарат в M-02\"],[\"И-05\",\"Ошибка механизма, замятие коробки\",\"error_raised с кодом мотора или датчика\",\"Блокирующий\",\"По коду ошибки определить узел. Позвонить в ТТ: уточнить, как загружали коробки\",{\"visit\":\"p\",\"tt\":\"s\"},\"Механизм исправен, блокировка снята\"],[\"И-06\",\"Температура камеры вне нормы\",\"freezerTempC вне нормы, приостановка продаж\",\"Блокирующий\",\"Позвонить в ТТ: закрыты ли двери, состояние товара. Товар с нарушенным хранением утилизируется по правилам технолога\",{\"tt\":\"p\",\"visit\":\"s\"},\"Температура в норме, продажи возобновлены\"],[\"И-07\",\"Позиция без итога\",\"order_error с unconfirmed, order_expired\",\"Неблокирующий\",\"Позвонить в ТТ: проверить, выдана ли пицца. При невыдаче — возврат денег. Передать интегратору КШ\",{\"tt\":\"p\",\"ksh\":\"p\"},\"Итог подтвержден, возврат выполнен, причина записана\"],[\"И-08\",\"Невыдача после оплаты (обращение покупателя)\",\"Обращение ТТ или покупателя, нет события выдачи\",\"Неблокирующий\",\"Позвонить в ТТ: вернуть деньги через интерфейс администратора КСО. Передать интегратору КШ для расследования с Интегратором-Тилси\",{\"tt\":\"p\",\"ksh\":\"p\",\"tilpos\":\"s\"},\"Деньги возвращены, причина найдена\"],[\"И-09\",\"Проблема кассы\",\"Сообщение ТТ: POS-терминал, фискальный регистратор, зависание, интерфейс, СБП\",\"Блокирующий\",\"Позвонить в СП Тилпос\",{\"tilpos\":\"p\",\"tt\":\"s\"},\"КСО принимает оплату\"],[\"И-10\",\"КСО не видит аппарат\",\"Платформа: «health»: true, продаж нет, ошибки хаба\",\"Блокирующий\",\"Передать интегратору КШ: проверить /health и сеть точки. Позвонить в ТТ: проверить сетевой кабель\",{\"ksh\":\"p\",\"tt\":\"s\",\"tilpos\":\"s\"},\"Хаб получает /health, продажи идут\"],[\"И-11\", :'&gt;','\"':'&quot;'}[c]));\nconst md = s => esc(s).replace(/\\*\\*([^*]+)\\*\\*/g, '<b>$1<\/b>');\nfunction el(tag, attrs, parent){\n  const e = document.createElementNS(NS, tag);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  if (parent) parent.appendChild(e);\n  return e;\n}\nfunction txt(parent, x, y, cls, s){\n  const t = el('text', {x, y, class: cls}, parent);\n  t.textContent = s;\n  return t;\n}\n\nconst MODES = Object.fromEntries(M.modes.map(m => [m.id, m]));\nconst par = id => id.indexOf('.') > 0 ? id.slice(0, id.indexOf('.')) : null;\nconst rel = (list, id) => list.some(x => x === '*' || x === id || x === par(id) || par(x) === id);\nconst tid = n => 'T-' + String(n).padStart(2, '0');\nconst TM = Object.fromEntries(M.trans.map(t => [t.n, t]));\nconst label = t => t.fromL + ' → ' + t.toL;\nconst KIND = {human:'действие человека на месте', auto:'автоматически', remote:'автоматически или удаленно', lock:'блокировка продаж'};\n\n/* Геометрия схемы, единицы viewBox 1300 x 800 */\nconst COMPS = [\n  {id:'M-03', x:40, y:230, w:420, h:300, tx:60, ty:516},\n  {id:'M-05', x:800, y:230, w:420, h:300, tx:820, ty:516},\n  {id:'M-04', x:40, y:610, w:1180, h:170, tx:60, ty:766}\n];\nconst NODES = [\n  {id:'OFF', x:40, y:50, w:190, h:70},\n  {id:'M-01', x:330, y:50, w:220, h:70},\n  {id:'M-02', x:660, y:50, w:280, h:70},\n  {id:'M-03.1', x:80, y:270, w:340, h:70},\n  {id:'M-03.2', x:80, y:400, w:340, h:70},\n  {id:'M-05.1', x:840, y:270, w:340, h:70},\n  {id:'M-05.2', x:840, y:400, w:340, h:70},\n  {id:'M-04.1', x:90, y:650, w:300, h:70},\n  {id:'M-04.2', x:480, y:650, w:300, h:70},\n  {id:'M-04.3', x:870, y:650, w:300, h:70}\n];\nconst PSEUDO = [{t:18, x:40, y:150, w:190, h:30, label:'Из любого режима'}];\n/* p — ломаные, b — центры номеров, na — номера ломаных без стрелки (примыкание к другой линии) */\nconst EDGES = [\n  {t:18, p:[[[135,150],[135,120]]], b:[]},\n  {t:1, p:[[[230,85],[330,85]]], b:[[280,85]]},\n  {t:2, p:[[[550,72],[660,72]]], b:[[605,72]]}, rt','Самопроверка или ручное управление'],['none','Не работают'],['off','Запрещены до осмотра человеком']],\n    info:'Кнопки аварийного останова нет: аппарат останавливают обесточиванием (T-18). Защелка печи запрещает новую готовку, пока человек не проверит камеру.'}\n};\n\nlet layer = 'none', sel = null, scen = null;\n\nfunction buildSvg(){\n  const svg = $('#sm');\n  const defs = el('defs', {}, svg);\n  [['ah','mk-fg'],['ahd','mk-danger']].forEach(([id, cls]) => {\n    const m = el('marker', {id, viewBox:'0 0 10 10', refX:'9.5', refY:'5', markerWidth:9, markerHeight:9, markerUnits:'userSpaceOnUse', orient:'auto-start-reverse'}, defs);\n    el('path', {d:'M0,0 L10,5 L0,10 z', class: cls}, m);\n  });\n  COMPS.forEach(c => {\n    const g = el('g', {class:'node comp', 'data-s': c.id, tabindex:'0', role:'button', 'aria-label': c.id + ' ' + MODES[c.id].name}, svg);\n    el('rect', {x:c.x, y:c.y, width:c.w, height:c.h, rx:10}, g);\n    txt(g, c.tx, c.ty, 'ctitle', c.id + ' · ' + MODES[c.id].name);\n  });\n  const gt = el('g', {}, svg);\n  EDGES.forEach(e => {\n    const t = TM[e.t];\n    const g = el('g', {class:'tr ' + t.kind, 'data-t': e.t}, gt);\n    e.p.forEach((pts, i) => {\n      const d = pathD(pts);\n      el('path', {d, class:'halo'}, g);\n      el('path', {d, class:'hit'}, g);\n      const a = {d, class:'ln'};\n      if (!(e.na || []).includes(i)) a['marker-end'] = t.kind === 'lock' ? 'url(#ahd)' : 'url(#ah)';\n      if (e.both) a['marker-start'] = 'url(#ah)';\n      el('path', a, g);\n      if ((e.na || []).includes(i)){ const [x, y] = pts[pts.length - 1]; el('circle', {cx:x, cy:y, r:3, class:'junc'}, g); }\n    });\n    e.b.forEach(([x, y]) => {\n      const b = el('g', {class:'badge', 'data-t': e.t, tabindex:'0', role:'button', 'aria-label':'Переход ' + tid(t.n) + ': ' + label(t)}, g);\n      el('circle', {cx:x, cy:y, r:11}, b);\n      txt(b, x, y + 0.5, '', String(e.t));\n    });\n  });\n  NODES.forEach(n => {\n    const m = MODES[n.id];\n    const g = el('g', {class:'node atom' + (par(n.id) ? ' sub' : ''), 'data-s': n.id, tabindex:'0', role:'button', 'aria-label': (n.id === 'OFF' ? '' : n.id + ' ') + m.name}, svg);\n    el('rect', {x:n.x, y:n.y, width:n.w, height:n.h, rx:7}, g);\n    const cx = n.x + n.w / 2;\n    txt(g, cx, 0, 'nid', m.disp);\n    txt(g, cx, 0, 'nname', m.name);\n    txt(g, cx, 0, 'nstat', '');\n  });\n  PSEUDO.forEach(p => {\n    const g = el('g', {class:'pseudo', 'data-t': p.t, tabindex:'0', role:'button', 'aria-label': p.label + ', переход ' + tid(p.t)}, svg);\n    el('rect', {x:p.x, y:p.y, width:p.w, height:p.h, rx:p.h / 2}, g);\n    txt(g, p.x + p.w / 2, p.y + p.h / 2 + 4, '', p.label);\n  });\n}\n\nfunction paint(){\n  const svg = $('#sm');\n  svg.classList.toggle('l-none', layer === 'none');\n  svg.querySelectorAll('.node.atom').forEach(g => {\n    const n = NG[g.dataset.s], my = n.y + n.h / 2;\n    const r = g.querySelector('rect'), [tId, tName, tStat] = g.querySelectorAll('text');\n    if (layer === 'none'){\n      r.style.fill = ''; r.style.stroke = '';\n      tStat.textContent = '';\n      tId.setAttribute('y', my - 9); tName.setAttribute('y', my + 12);\n    } else {\n      const [c, l] = LAYERS[layer].cat[g.dataset.s];\n      r.style.fill = `var(--${c}-bg)`; r.style.stroke = `var(--${c})`;\n      tStat.textContent = l;\n      tId.setAttribute('y', my - 17); tName.setAttribute('y', my + 3); tStat.setAttribute('y', my + 21);\n    }\n  });\n  $('#legend').innerHTML = layer === 'none' ? '' : LAYERS[layer].legend.map(([c, l]) => `<span><i class=\"sw\" style=\"background:var(--${c}-bg);border-color:var(--${c})\"><\/i>${esc(l)}<\/span>`).join('');\n}\n\n/* Выделение: режим, переход, признак */\nfunction related(){\n  if (scen){\n    const [, hl] = M.scen[scen.i].steps[scen.k];\n    if (/^T-/.test(hl)) return {k:'t', n:+hl.slice(2)};\n    return {k:'s', id:hl};\n  }\n  return sel;\n}\nfunction apply(){\n  const svg = $('#sm');\n  const s = related();\n  svg.classList.toggle('has-sel', !!s);\n h=\"34\" height=\"10\" aria-hidden=\"true\"><line class=\"${cls}\" x1=\"1\" y1=\"5\" x2=\"33\" y2=\"5\"/><\/svg><span>${text}<\/span>`;\nconst rcol = id => id === 'OFF' ? null : (par(id) === 'M-03' || id === 'M-03') ? 'M-03' : (par(id) === 'M-04' || id === 'M-04') ? 'M-04' : (M.rcols.includes(id) ? id : null);\n\nfunction cmdsHtml(id){\n  const col = rcol(id);\n  if (id === 'OFF') return '<p class=\"note\">Связи нет, команды не поступают.<\/p>';\n  if (!col) return '<p class=\"note\">Команды заданы отдельно для M-05.1 и M-05.2.<\/p>';\n  const ok = M.cmds.filter(c => c.cells[col]).map(c => {\n    const cell = c.cells[col];\n    const d = /^Да/.test(c.danger) ? ' <span class=\"dg\">опасная<\/span>' : '';\n    return `<li>${esc(c.cmd)}${cell[1] ? ` <i>(${esc(cell[1])})<\/i>` : ''}${d}<\/li>`;\n  });\n  return `<h4>Удаленные и сервисные команды<\/h4>${ok.length ? `<ul class=\"rc\">${ok.join('')}<\/ul>` : '<div class=\"empty\">Нет<\/div>'}`;\n}\n\nfunction introHtml(){\n  return `<h3>Как читать схему<\/h3>\n    <ul>\n      <li>Блоки — режимы аппарата. Блоки внутри M-03, M-04 и M-05 — подрежимы.<\/li>\n      <li>Нажмите на режим, чтобы раскрыть его переходы, на номер — чтобы увидеть условие и действия.<\/li>\n      <li>Слой раскрашивает режимы по статусу для хаба, статусу платформы, учету времени или работе механики.<\/li>\n      <li>Сценарий проводит по схеме шаг за шагом.<\/li>\n    <\/ul>\n    <div class=\"lgline\">${lgRow('', 'Действие человека на месте')}${lgRow('dash', 'Автоматически')}${lgRow('dot', 'Автоматически или удаленно')}${lgRow('danger', 'Блокировка продаж')}<\/div>\n    ${layer !== 'none' ? `<p class=\"note\">${esc(LAYERS[layer].info)}<\/p>` : ''}\n    <h4>Признаки аппарата<\/h4><div class=\"chips\">${M.flags.map(gotoF).join('')}<\/div>\n    <p class=\"note\">Таблицы модели — в справочнике под схемой.<\/p>`;\n}\n\nconst FL = [['accept','Прием заказов'],['motion','Механика и нагрев'],['person','Кто внутри'],['hub','Статус для хаба'],['plat','Платформа'],[ visible,.nav button:focus-visible,.tabs button:focus-visible,.refblock summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}\n.attrs{display:grid;gap:6px;margin:0;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:13.5px}\n.attrs b{font-weight:600}\n.lgline{display:grid;grid-template-columns:34px 1fr;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted)}\n.lgline svg line{stroke:var(--fg);stroke-width:1.6}\n.lgline .cyc{stroke-width:3}\n.lgline .thin{stroke:var(--muted);stroke-width:1.4}\n.lgline .dash{stroke-dasharray:6 4}\n.lgline .dot{stroke-dasharray:1.5 3.5;stroke-linecap:round;stroke-width:2}\n.lgline .danger{stroke:var(--danger);stroke-dasharray:6 4}\n#legend:empty{display:none}\n\n#sm{min-width:900px}\n@media (min-width:1200px){#sm{min-width:0}}\n#sm .nid{font-size:12px}\n#sm .nname{font-size:15px}\n#sm .nstat{font-size:12px}\n#sm .ctitle{font-size:13.5px}\n#sm .badge text{font-size:11.5px}\n#sm.v-ov #g-dt{display:none}\n#sm.v-dt #g-ov{display:none}\n#sm:not(.l-safety) #g-flags{display:none}\n#sm.l-none .node.atom rect{fill:var(--surface);stroke:var(--fg);stroke-width:1.4}\n#sm.v-ov.l-none .node.sub rect{fill:transparent;stroke:var(--muted);stroke-dasharray:4 3;stroke-width:1.2}\n#sm.v-ov.l-none .node.sub text{fill:var(--muted)}\n#sm .ag path{fill:none;stroke-linejoin:round}\n#sm .ag path.halo{stroke:var(--surface);stroke-width:6}\n#sm .ag path.ln{stroke:var(--muted);stroke-width:1.4}\n#sm .ag.cycle path.ln{stroke:var(--fg);stroke-width:2.8}\n#sm .ag.safety path.ln{stroke:var(--danger);stroke-dasharray:6 4}\n#sm .ag.remote path.ln{stroke-dasharray:1.5 3.5;stroke-linecap:round;stroke-width:2}\n#sm .ag path.hit{stroke:transparent;stroke-width:16}\n#sm .ag{cursor:pointer;transition:opacity .15s}\n#sm .ag:focus{outline:none}\n#sm .ag:focus-visible path.ln{stroke-width:4}\n#sm .pill rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}\n#sm .pill text{font:600 11.5px var(--font-mono);fill:var(--muted);text-anchor:middle;dominant-baseline:central}\n#sm .mk-muted{fill:var(--muted)}\n#sm.has-sel .ag:not(.on){opacity:.15}\n#sm .ag.on path.ln{stroke-width:3.2}\n#sm.has-sel .tr.trail{opacity:.5}\n#sm.has-sel .node.trail{opacity:.65}\n@media (prefers-reduced-motion: reduce){#sm .ag{transition:none}}\n\n.refblock{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 18px}\n.refblock summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:16px}\n.refblock summary span{font-weight:400;font-size:13.5px;color:var(--muted);margin-left:8px}\n.refblock[open]{padding-bottom:18px}\n.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}\n.tabs button{font:500 13.5px var(--font-body);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--muted);cursor:pointer}\n.tabs button[aria-selected=\"true\"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}\n.tabp{display:grid;gap:10px;min-width:0}\n.pillsample{justify-self:start;font:600 11.5px var(--font-mono);color:var(--muted);border:1.2px solid var(--muted);border-radius:10px;padding:0 7px;line-height:18px}\n.rsec{display:grid;gap:10px;min-width:0}\n.rsec + .rsec{margin-top:10px}\n.rsec h3{margin:4px 0 0;font-size:16px;font-weight:700}\n.card p{margin:0;max-width:85ch}\n.dg{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:18px;background:var(--off-bg);color:var(--off);white-space:nowrap}\ntable.matrix{min-width:1220px}\ntd.dz{font-size:13px;min-width:150px}\n.side h4{margin:6px 0 0;font:500 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div class=\"eyebrow\">РТК · Модель режимов v3.2<\/div>\n    <h1>Режимы работы РТК<\/h1>\n    <p class=\"lead\">Модель для оценки специалистами. Начните с обзора: нажмите на режим, чтобы раскрыть его переходы, или выберите сценарий.<\/p>\n  <\/header>\n\n  <div class=\"controls\" id=\"scheme\">\n    <div class=\"seg\" role=\"group\" aria-label=\"Вид схемы\">\n      <button type=\"button\" id=\"v-ov\" data-view=\"ov\" aria-pressed=\"true\">Обзор<\/button>\n      <button type=\"button\" id=\"v-dt\" data-view=\"dt\" aria-pressed=\"false\">Все переходы<\/button>\n    <\/div>\n    <label class=\"ctl\" for=\"layer\">Слой\n      <select id=\"layer\">\n        <option value=\"none\">Без слоя<\/option>\n        <option value=\"safety\">Безопасность<\/option>\n        <option value=\"remote\">Удаленное управление<\/option>\n        <option value=\"time\">Учет времени<\/option>\n        <option value=\"hub\">Статус для хаба<\/option>\n      <\/select>\n    <\/label>\n    <label class=\"ctl\" for=\"scen\">Сценарий\n      <select id=\"scen\"><option value=\"\">Не выбран<\/option><\/select>\n    <\/label>\n    <div class=\"legend\" id=\"legend\"><\/div>\n  <\/div>\n\n  <div class=\"main\">\n    <figure class=\"diagram\" id=\"fig\">\n      <div class=\"scroll\">\n        <svg id=\"sm\" viewBox=\"0 0 1260 900\" role=\"group\" aria-label=\"Схема режимов РТК: семь режимов, подрежимы и переходы между ними\"><\/svg>\n      <\/div>\n    <\/figure>\n    <aside class=\"side\" id=\"card\" aria-live=\"polite\"><\/aside>\n  <\/div>\n\n  <details class=\"refblock\" id=\"ref\">\n    <summary>Справочник модели<span>принципы, У-1, режимы, переходы, питание и остановки, сбои, заказ, удаленные команды, параметры<\/span><\/summary>\n    <div class=\"tabs\" role=\"tablist\" aria-label=\"Разделы справочника\" id=\"tabs\"><\/div>\n    <div id=\"tabps\"><\/div>\n  <\/details>\n\n  <footer>Тексты и таблицы справочника воспроизводят «Модель режимов v3.2» без изменений. Схема, слои, сценарии и матрица удаленных команд являются производными представлениями. Шаги сценариев «Аварийный останов», «Столкновение», «Ручное завершение позиции» и «Пропадание питания» взяты из текста модели, остальные сценарии составлены из ее переходов. Формулировки по нажатию на ID взяты из книги «РТК: Системные требования» v22. При расхождении приоритет у документа модели.<\/footer>\n<\/div>\n<div id=\"refcard\" class=\"refcard\" role=\"dialog\" aria-label=\"Формулировка из книги требований\" hidden><\/div>\n<script>\nconst DOC = [\n{\n\"k\": \"p\",\n\"style\": \"Heading 2\",\n\"list\": false,\n\"t\": \"Модель режимов РТК v3.2\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Сводная редакция: v3 с изменениями v3.1 и v3.2. Идентификаторы требований — по книге «РТК: Системные требования» v22. Номера режимов и переходов сохранены. Документ самодостаточен, предыдущие версии для работы с ним не нужны.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Ответ на замечания к v3.1\"\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"№\",\n\"Решение\",\n\"Что изменено\"\n],\n[\n\"1\",\n\"Принят первый вариант\",\n\"Подсистемы для удаленного перезапуска разделены на три группы. Без приводов и нагрева (SS-07.06, SS-07.07) — в любом режиме, в M-03 при П2 = «Ожидание». С приводами или нагревом (SS-05.02, SS-17.05.01, кофемашина, ледогенератор) — только в M-03 при П2 = «Ожидание». Контроллеры манипуляторов и оси — только в M-03 с переходом в M-06 по T-10. В M-05 их перезапускает инженер на месте, переход не нужен. Основание — ГОСТ Р 60.1.2.2, 5.6.5 k)\"\n],\n[\n\"2\",\n\"Принято\",\n\"В таблицу удаленных команд добавлен столбец «Опасная». Опасная команда — та, после которой без действий человека могут начаться движение приводов опасных движений или нагрев (5.6.5 e). На столбец ссылаются принцип 5 и признак «Локальное управление активно». Команды «Установить отметку» и «Перевести в M-05.2» объединены: в M-03 установка отметки запускает T-09 с парковкой, поэтому там команда опасная\"\n],\n[\n\"3\",\n\"Принято\",\n\"Категория 0 снимает питание приводов (ГОСТ Р МЭК 60204-1, 9.2.2). Контроллеры манипуляторов и оси остаются включенными и сохраняют положение. Подтверждение для AUBO и оси — В-18\"\n],\n[\n\"4\",\n\"Принято с изменением\",\n\"Введен параметр Δ — допустимое отклонение от запрограммированной траектории (В-19). В У-1 добавлено условие 6. Если оно не выполнено, пуск невозможен, манипулятор возвращает вручную сервисный инженер в M-05.2 (T-20). Отметку «Критический отказ» не ставим: это не отказ, отметка исказила бы наработку на отказ. Переоценить H-01.05, H-01.06, H-05.01\"\n],\n[\n\"5\",\n\"Принято\",\n\"Таблица причин П1 с категорией учета и правилом старшинства. Для M-06 категория учета зависит от причины входа\"\n],\n[\n\"6\",\n\"Принято, резерв не вводим\",\n\"Оценка — в разделе «Ячейка брака», решение — в разделе «Решения v3.2»\"\n],\n[\n\"7\",\n\"Принято\",\n\"Смена — интервал между двумя ежедневными обслуживаниями M-04.1. Окно T-13 и уведомление о невыполненном обслуживании отсчитываются от планового времени ежедневного обслуживания. Это параметр точки, для круглосуточной точки его задает магазин\"\n],\n[\n\"8\",\n\"Принято\",\n\"Ответ на Q-42 — раздел «Незавершенные заказы». Позицию доготавливает сотрудник магазина на оборудовании РТК, исполнитель не меняется, поэтому перемаршрутизации нет. З-11 требует пары IFR РТК → хаб и согласования с владельцем ConOps Контура\"\n],\n[\n\"Питание\",\n\"Выбрано решение 4\",\n\"При пропадании сети РТК приостанавливает прием, завершает текущую операцию, паркует манипуляторы и ждет на питании от ИБП. Сеть вернулась до порога заряда ИБП — прием возобновляется автоматически (SR-183). Заряд ниже порога — T-05 или T-10, учет как организационный простой\"\n]\n]\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Принципы\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Режим выделяется, если он отличается от соседних хотя бы одним из пяти признаков и это отличие можно проверить отдельным требованием. Признаки: обслуживание покупателей, конфигурация безопасности, полномочия, статус для хаба, учет времени.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Подрежим наследует свойства режима и добавляет свои. Подрежимы одного режима взаимоисключающие.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Признак состояния не меняет пяти признаков режима, признаки могут действовать одновременно. Признаки РТК действуют в любом режиме, признаки П1–П3 — только в M-03.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"В M-03 РТК входит только из M-02.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Пуск после остановки — возобновление движения приводов опасных движений после защитной остановки, после нахождения человека в зоне или после прерывания питания приводов. Такой пуск выполняет только человек на месте по условию У-1. Опасные удаленные команды допустимы только в M-03 при признаке «Зона подтверждена пустой» и неактивном локальном управлении.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Сработавшая функция безопасности сбрасывается только на месте. Смена режима ее не сбрасывает.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"При отказе контроллера безопасности движение запрещено во всех режимах, включая ручное управление.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Требования к движению распространяются на все приводы опасных движений: манипуляторы, линейную ось, пресс гриля, платформы ячеек, устройство надевания крышек, диспенсеры, узел вскрытия.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Время учитывается только в пределах графика работы точки.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Единая точка управления: пока РТК в M-04 или в M-05 вне тестового цикла, он не передает команды оборудованию приготовления, включая промывку по расписанию (SR-270). Оборудованием управляют только с его панелей (ГОСТ Р МЭК 60204-1, 9.2.5.1).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Условие пуска У-1\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Применяется при входе в M-02 из M-04, M-05, M-06.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Команду подает человек у сервисной панели вне рабочей зоны. Зона просматривается полностью (В-2), людей в ней нет.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Дверь доступа закрыта и заперта.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Все функции безопасности исправны, ни одна не находится в сработавшем состоянии: кнопка аварийного останова отжата, пожарного сигнала нет, устройство блокировки двери исправно.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Отметки «Критический отказ» нет.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Ручное управление выключено.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": true,\n\"t\": \"Положение звеньев манипуляторов и кареток оси известно и отклоняется от запрограммированной траектории не более чем на Δ. Если условие не выполнено, сервисная панель показывает причину, диспетчер получает уведомление о вызове инженера.\"\n},\n{\n\"k\": \"p\",\n\"style\": \"normal\",\n\"list\": false,\n\"t\": \"Пуск выполняется двумя действиями: сброс сработавших функций, затем отдельная команда пуска (ГОСТ Р 60.1.2.2, 5.6.3.4.2, ГОСТ Р МЭК 60204-1, 9.2.5.4.1).\"\n},\n{\n\"k\": \"p\",\n\"style\": \"Heading 3\",\n\"list\": false,\n\"t\": \"Признаки РТК\"\n},\n{\n\"k\": \"t\",\n\"rows\": [\n[\n\"Признак\",\n\"Устанавливается\",\n\"Снимается\",\n\"Действие\"\n],\n[\n\"Критический отказ\",\n\"Автоматически при отказе из перечня или диспетчером\",\n\"Сервисным инженером на месте\",\n\"Блокирует У-1. Выход из M-04 — только по T-20 или T-26, из M-06 — только по T-18 или T-20\"\n],\n[\n\"Зона подтверждена пустой\",\n\"При пуске по У-1\",\n\"При открытии двери\",\n\"Разрешает опасные удаленные команды (ГОСТ Р 6 .1\",\n\"Ежедневное обслуживание\",\n\"Пополнение, проверка сроков, уборка, отходы, извлечение невостребованных заказов и брака. В начале и в конце смены, до закрытия обязательно (Q-49). Пополнение в течение смены — тоже здесь\",\n\"\",\n\"\",\n\"\",\n\"\",\n\"\",\n\"Плановый простой\"\n],\n[\n\"M-04.2\",\n\"Оперативное вмешательство\",\n\"Упавший предмет, затор, пролив в рабочей зоне, уборка после M-06, ручное завершение позиции\",\n\"\",\n\"\",\n\"\",\n\"\",\n\"\",\n\"Внеплановый простой и счетчик вмешательств\"\n],\n[\n\"M-05\",\n\"Инженерный\",\n\"Работы инженера, вход по сигналу разрешения входа\",\n\"Нет\",\n\"Ручное управление с пульта: не более 250 мм/с, с деблокирующим устройством (5.6.4). Автоматически — только тестовый цикл при закрытой двери\",\n\"Сервисный инженер, инженер-разработчик\",\n\"Да\",\n\"Недоступен\",\n\"По подрежиму\"\n],\n[\n\"M-05.1\",\n\"Плановое ТО\",\n\"По графику (SR-160.1)\",\n\"\",\n\"\",\n\"Сервисный инженер\",\n\"\",\n\"\",\n\"Плановый простой\"\n],\n[\n\"M-05.2\",\n\"Внеплановое ТО\",\n\"Ремонт после критического отказа, ручной возврат манипуляторов на траекторию\",\n\"\",\n\"\",\n\"Сервисный инженер\",\n\"\",\n\"\",\n\"Внеплановый простой\"\n],\n[\n\"M-05.3\",\n\"Наладка\",\n\"Пусконаладка, траектории, калибровка, обновление ПО и технологических карт, перемещение, вывод из эксплуатации\",\n\"\",\n\"\",\n\"Инженер-разработчик, сервисный инженер\",\n\"\",\n\"\",\n\"Плановый простой\"\n],\n[\n\"M-06\",\n\"Защитная остановка\",\n\"Сработала функция безопасности, произошла остановка по столкновению, прервано питание приводов или заряд ИБП опустился ниже порога при отсутствии сети\",\n\"Нет\",\n\"Обесточены\",\n\"Нет. Для уборки — переход в M-04.2\",\n\"Да\",\n\"Недоступен\",\n\"По причине входа, таблица ниже\"\n],\n[\n\"—\",\n\"Выключен\",\n\"Монтаж, перевозка, демонтаж\",\n\"Нет\",\n\"Обесточены\",\n\"По процедуре монтажа\",\n\"Нет: без питания замки ячеек открываются (SR-109.1.2), поэтому ячейки должны быть пусты\",\n\"Нет связи\",
